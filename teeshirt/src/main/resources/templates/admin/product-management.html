<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tee Shirt Vibe - Quản lý sản phẩm</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <main class="d-flex flex-column p-3 w-100">
        <!-- Header -->
        <h3 class="fw-bold text-center mb-3">Quản lý sản phẩm</h3>
        <!-- Card bộ lọc tìm kiếm -->
        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-4 align-items-end justify-content-center">
                    <div class="col-md-4 d-flex flex-column gap-3 ps-md-5 filter-group-left">
                        <div class="d-flex align-items-center">
                            <label for="filterProduct" class="form-label fw-semibold mb-0 me-2" style="min-width:90px;">Tìm kiếm:</label>
                            <input type="text" class="form-control rounded-pill px-3 text-center" id="filterProduct"
                                placeholder="Tìm tên, mã sản phẩm...">
                        </div>
                        <div class="d-flex align-items-center mt-2">
                            <label for="filterStatus" class="form-label fw-semibold mb-0 me-2" style="min-width:90px;">Trạng thái:</label>
                            <select class="form-select rounded-pill px-3 text-center" id="filterStatus">
                                <option value="">Tất cả</option>
                                <option value="active">Đang bán</option>
                                <option value="inactive">Ngừng bán</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-8 d-flex flex-column gap-3 justify-content-center">
                        <div class="d-flex align-items-center justify-content-center gap-3 mt-2">
                            <label for="filterCategory" class="form-label fw-semibold mb-0 me-2" style="width:90px;">Danh mục:</label>
                            <select class="form-select rounded-pill px-3 text-center" id="filterCategory" style="width: 250px;">
                                <option value="">Tất cả</option>
                                <option value="Áo thun">Áo thun</option>
                                <option value="Áo polo">Áo polo</option>
                                <option value="Áo khoác">Áo khoác</option>
                                <option value="Áo hoodie">Áo hoodie</option>
                            </select>
                        </div>
                        <div class="d-flex align-items-center justify-content-center gap-3 mt-2">
                            <button type="button" class="btn btn-primary px-4 rounded-pill fw-bold">Tìm kiếm</button>
                            <button type="button" class="btn btn-danger px-4 rounded-pill fw-bold">Làm mới bộ lọc</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <!-- Thông tin bảng sản phẩm -->
        <div class="card flex-grow-1 d-flex flex-column">
            <div class="card-header border-0 pb-0 bg-white d-flex align-items-center justify-content-between pt-2" style="margin-top: 8px;">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-table-list me-2"></i>Danh sách sản phẩm</h5>
                <button type="button" class="btn btn-primary rounded-pill fw-bold px-3 py-1" style="font-size: 1rem;" onclick="window.location.href='product-add-management.html'">
                    <i class="fa-solid fa-plus me-2"></i>Thêm sản phẩm
                </button>
            </div>
            <div class="card-body flex-grow-1 d-flex flex-column p-3 pb-0">
                <div class="flex-grow-1 overflow-auto">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="bg-primary bg-gradient text-white">
                            <tr>
                                <th class="text-center" style="width:40px;">#</th>
                                <th class="text-center">Mã sản phẩm</th>
                                <th class="text-center">Tên sản phẩm</th>
                                <th class="text-center">Danh mục</th>
                                <th class="text-center">Biến thể</th>
                                <th class="text-center">Giá</th>
                                <th class="text-center">Trạng thái</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="productTable">
                            <tr>
                                <td class="text-center">1</td>
                                <td class="text-center">SP001</td>
                                <td>Áo thun nam basic</td>
                                <td>Áo thun</td>
                                <td>4</td>
                                <td>200.000đ</td>
                                <td><span class="badge bg-success">Đang bán</span></td>
                                <td>
                                    <button class="btn btn-sm btn-info me-1" title="Xem" onclick="window.location.href='product-detail-management.html'"><i class="fa-solid fa-eye"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-center">2</td>
                                <td class="text-center">SP002</td>
                                <td>Áo polo nữ</td>
                                <td>Áo polo</td>
                                <td>3</td>
                                <td>180.000đ</td>
                                <td><span class="badge bg-success">Đang bán</span></td>
                                <td>
                                    <button class="btn btn-sm btn-info me-1" title="Xem" onclick="window.location.href='product-detail-management.html'"><i class="fa-solid fa-eye"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td class="text-center">3</td>
                                <td class="text-center">SP003</td>
                                <td>Áo khoác đại bàng</td>
                                <td>Áo khoác</td>
                                <td>2</td>
                                <td>150.000đ</td>
                                <td><span class="badge bg-secondary">Ngừng bán</span></td>
                                <td>
                                    <button class="btn btn-sm btn-info me-1" title="Xem" onclick="window.location.href='product-detail-management.html'"><i class="fa-solid fa-eye"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <nav class="mt-4 mb-2">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item disabled"><a class="page-link" href="#">Trước</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">Sau</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
