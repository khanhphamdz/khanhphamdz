    <script>
        // Revenue Chart
        const revenueChart = new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: ['18/05', '19/05', '20/05', '21/05', '22/05', '23/05', '24/05'],
                datasets: [
                    {

                        data: [5000000, 6000000, 4500000, 7000000, 8000000, 5500000, 9000000],
                        borderColor: '#1E90FF',
                        backgroundColor: 'rgba(30, 144, 255, 0.2)',
                        fill: true
                    },
                    {
                        label: 'Doanh thu online',
                        data: [3000000, 4000000, 3500000, 5000000, 4500000, 6000000, 7000000],
                        borderColor: '#FF6347',
                        backgroundColor: 'rgba(255, 99, 71, 0.2)',
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Doanh thu (VNĐ)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Ngày'
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    title: {
                        display: true,
                        text: 'Doanh thu theo thời gian'
                    }
                }
            }
        });

        // Order Status Chart
        const orderStatusChart = new Chart(document.getElementById('orderStatusChart'), {
            type: 'pie',
            data: {
                labels: ['Đang xử lý', 'Hoàn tất', 'Đã hủy'],
                datasets: [
                    {
                        label: 'Trạng thái đơn hàng',
                        data: [36, 72, 12],
                        backgroundColor: ['#FFCE56', '#36A2EB', '#FF6384'],
                        borderColor: ['#D4A017', '#2E8BC0', '#D53F5A'],
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    title: {
                        display: true,
                        text: 'Phân bố trạng thái đơn hàng'
                    }
                }
            }
        });

        // Function to update dashboard based on time filter
        function updateDashboard() {
            const timeFilter = document.getElementById('timeFilter').value;
            // Giả lập cập nhật dữ liệu (thay bằng API thực tế)
            if (timeFilter === 'today') {
                document.getElementById('totalRevenue').textContent = '50,000,000 VNĐ';
                document.getElementById('totalOrders').textContent = '40';
                document.getElementById('productsSold').textContent = '120';
                document.getElementById('totalInventory').textContent = '2,500';
                document.getElementById('counterOrders').textContent = '30';
                document.getElementById('onlineOrders').textContent = '10';
            } else if (timeFilter === 'week') {
                document.getElementById('totalRevenue').textContent = '150,000,000 VNĐ';
                document.getElementById('totalOrders').textContent = '120';
                document.getElementById('productsSold').textContent = '350';
                document.getElementById('totalInventory').textContent = '2,500';
                document.getElementById('counterOrders').textContent = '80';
                document.getElementById('onlineOrders').textContent = '40';
            } else {
                document.getElementById('totalRevenue').textContent = '450,000,000 VNĐ';
                document.getElementById('totalOrders').textContent = '360';
                document.getElementById('productsSold').textContent = '950';
                document.getElementById('totalInventory').textContent = '2,500';
                document.getElementById('counterOrders').textContent = '240';
                document.getElementById('onlineOrders').textContent = '120';
            }

            // Cập nhật biểu đồ (giả lập, thay bằng dữ liệu thực tế)
            revenueChart.data.datasets[0].data = timeFilter === 'today' ? [2000000, 3000000, 2500000, 4000000, 5000000, 3500000, 6000000] : [5000000, 6000000, 4500000, 7000000, 8000000, 5500000, 9000000];
            revenueChart.data.datasets[1].data = timeFilter === 'today' ? [1000000, 1500000, 2000000, 2500000, 3000000, 4000000, 5000000] : [3000000, 4000000, 3500000, 5000000, 4500000, 6000000, 7000000];
            revenueChart.update();

            orderStatusChart.data.datasets[0].data = timeFilter === 'today' ? [12, 24, 4] : [36, 72, 12];
            orderStatusChart.update();
        }
    </script>
    <script>
        // Fake data for products
        const products = [
            { id: 1, name: 'Áo thun nam', variants: [{ id: 1, color: 'Đen', size: 'M', price: 150000, stock: 50, barcode: 'THN001' }, { id: 2, color: 'Trắng', size: 'L', price: 150000, stock: 30 }] },
            { id: 2, name: 'Áo polo', variants: [{ id: 3, color: 'Xanh', size: 'S', price: 200000, stock: 20, barcode: 'POL001' }] },
            { id: 3, name: 'Áo sơ mi', variants: [{ id: 4, color: 'Trắng', size: 'M', price: 250000, stock: 15, barcode: 'SMI001' }] }
        ];

        let cart = [];
        let currentMode = 'quick';

        // Initialize mode selector for managers
        function initModeSelector() {
            const userRole = 'manager'; // Replace with actual role check (e.g., from session)
            if (userRole === 'manager') {
                document.getElementById('modeSelector').style.display = 'block';
            }
        }

        // Change mode
        function changeMode() {
            currentMode = document.getElementById('saleMode').value;
            const customerInfo = document.getElementById('customerInfo');
            if (currentMode === 'quick') {
                customerInfo.style.display = 'none';
            } else {
                customerInfo.style.display = 'block';
            }
            if (currentMode === 'delivery') {
                // Add delivery form (not implemented here for simplicity)
                alert('Chế độ giao hàng cần thêm form địa chỉ!');
            }
            updateCart();
        }

        // Search product
        document.getElementById('productSearch').addEventListener('input', function () {
            const searchText = this.value.toLowerCase();
            const matchingProducts = products.filter(p => p.name.toLowerCase().includes(searchText) || p.variants.some(v => v.barcode === searchText));
            if (matchingProducts.length === 1 && matchingProducts[0].variants.length === 1 && this.value) {
                addToCart(matchingProducts[0].variants[0]);
                this.value = '';
            }
        });

        // Add to cart
        function addToCart(variant) {
            const existingItem = cart.find(item => item.variant.id === variant.id);
            if (existingItem) {
                if (existingItem.quantity < variant.stock) existingItem.quantity++;
            } else {
                cart.push({ variant, quantity: 1 });
            }
            updateCart();
        }

        // Update cart display
        function updateCart() {
            const tbody = document.getElementById('selectedProductsBody');
            tbody.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.variant.name || item.variant.product.name}</td>
                        <td>${item.variant.color}, ${item.variant.size}</td>
                        <td><input type="number" class="form-control" value="${item.quantity}" min="1" max="${item.variant.stock}" onchange="updateQuantity(${item.variant.id}, this.value)"></td>
                        <td>${item.variant.price.toLocaleString()} VNĐ</td>
                        <td><button class="btn btn-sm btn-danger" onclick="removeFromCart(${item.variant.id})">Xóa</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
                total += item.variant.price * item.quantity;
            });
            document.getElementById('totalAmount').textContent = total.toLocaleString() + ' VNĐ';
            document.getElementById('finalAmount').textContent = total.toLocaleString() + ' VNĐ';
            calculateChange();
        }

        // Update quantity
        function updateQuantity(variantId, quantity) {
            const item = cart.find(item => item.variant.id === variantId);
            if (item && quantity <= item.variant.stock && quantity > 0) {
                item.quantity = parseInt(quantity);
            } else {
                alert('Số lượng không hợp lệ hoặc vượt tồn kho!');
            }
            updateCart();
        }

        // Remove from cart
        function removeFromCart(variantId) {
            cart = cart.filter(item => item.variant.id !== variantId);
            updateCart();
        }

        // Clear cart
        function clearCart() {
            cart = [];
            updateCart();
        }

        // Apply coupon
        function applyCoupon() {
            const couponCode = document.getElementById('couponCode').value;
            let discount = 0;
            if (couponCode === 'DISCOUNT10') discount = 10000; // Fake discount
            const total = parseInt(document.getElementById('totalAmount').textContent.replace(/[^0-9]/g, '')) || 0;
            const discountedAmount = total - discount;
            document.getElementById('discountAmount').textContent = discount.toLocaleString() + ' VNĐ';
            document.getElementById('finalAmount').textContent = discountedAmount.toLocaleString() + ' VNĐ';
            calculateChange();
        }

        // Calculate change
        function calculateChange() {
            const amountPaid = parseInt(document.getElementById('amountPaid').value) || 0;
            const finalAmount = parseInt(document.getElementById('finalAmount').textContent.replace(/[^0-9]/g, '')) || 0;
            const change = amountPaid - finalAmount;
            document.getElementById('changeAmount').textContent = (change > 0 ? change : 0).toLocaleString() + ' VNĐ';
        }

        // Process payment
        function processPayment() {
            if (cart.length === 0) {
                alert('Vui lòng thêm sản phẩm vào giỏ hàng!');
                return;
            }
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const customerId = document.getElementById('customerSelect').value || null;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const finalAmount = parseInt(document.getElementById('finalAmount').textContent.replace(/[^0-9]/g, '')) || 0;
            const amountPaid = parseInt(document.getElementById('amountPaid').value) || 0;

            if (amountPaid < finalAmount) {
                alert('Số tiền khách trả không đủ!');
                return;
            }

            // Fake order creation
            const orderId = new Date().getTime();
            console.log({
                orderId,
                customerId,
                customerInfo: customerId ? null : { name: customerName, phone: customerPhone },
                totalAmount: finalAmount,
                paymentMethod,
                paymentStatus: 'completed',
                items: cart.map(item => ({ variantId: item.variant.id, quantity: item.quantity, price: item.variant.price }))
            });

            alert(`Đơn hàng #${orderId} đã được tạo thành công!`);
            cart = [];
            updateCart();
        }

        // Print invoice
        function printInvoice() {
            if (cart.length === 0) {
                alert('Không có đơn hàng để in!');
                return;
            }
            const invoiceContent = `
                <h3>In hóa đơn</h3>
                <p>Thời gian: ${new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' })}</p>
                <table>
                    <thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Giá</th></tr></thead>
                    <tbody>${cart.map(item => `
                        <tr><td>${item.variant.name || item.variant.product.name} (${item.variant.color}, ${item.variant.size})</td><td>${item.quantity}</td><td>${item.variant.price.toLocaleString()} VNĐ</td></tr>
                    `).join('')}</tbody>
                </table>
                <p>Tổng tiền: ${document.getElementById('finalAmount').textContent}</p>
            `;
            const printWindow = window.open('', '', 'height=600,width=800');
            printWindow.document.write('<html><head><title>In hóa đơn</title></head><body>' + invoiceContent + '</body></html>');
            printWindow.document.close();
            printWindow.print();
        }

        // Initialize
        initModeSelector();
        updateCart();
    </script>
    <!-- JavaScript for order -->
    <script>
        // Fake data for orders
        let orders = [
            { id: '#ORD001', customer: 'Nguyễn Văn A', status: 'cho-xac-nhan', createdAt: '24/05/2025 14:00', source: 'online', paymentMethod: 'cash', totalAmount: 300000, items: [{ name: 'Áo thun nam', quantity: 2, price: 150000 }] },
            { id: '#ORD002', customer: 'Trần Thị B', status: 'hoan-tat', createdAt: '24/05/2025 13:30', source: 'counter', paymentMethod: 'card', totalAmount: 200000, items: [{ name: 'Áo polo', quantity: 1, price: 200000 }] },
            { id: '#ORD003', customer: 'Lê Văn C', status: 'da-huy', createdAt: '23/05/2025 16:00', source: 'online', paymentMethod: 'mobile', totalAmount: 250000, items: [{ name: 'Áo sơ mi', quantity: 1, price: 250000 }] },
            { id: '#ORD004', customer: 'Phạm Thị D', status: 'dang-chuan-bi', createdAt: '24/05/2025 15:00', source: 'online', paymentMethod: 'card', totalAmount: 450000, items: [{ name: 'Áo khoác', quantity: 1, price: 450000 }] },
            { id: '#ORD005', customer: 'Hoàng Văn E', status: 'dang-giao', createdAt: '24/05/2025 12:00', source: 'online', paymentMethod: 'card', totalAmount: 600000, items: [{ name: 'Áo len', quantity: 2, price: 300000 }] },
            { id: '#ORD006', customer: 'Ngô Thị F', status: 'tra-hang', createdAt: '23/05/2025 09:00', source: 'counter', paymentMethod: 'cash', totalAmount: 350000, items: [{ name: 'Áo thun nữ', quantity: 1, price: 350000 }] },
            { id: '#ORD007', customer: 'Vũ Văn G', status: 'cho-xac-nhan', createdAt: '24/05/2025 16:30', source: 'online', paymentMethod: 'card', totalAmount: 800000, items: [{ name: 'Áo vest', quantity: 1, price: 800000 }] }
        ];

        // Load orders table
        function loadOrders(filteredOrders = orders) {
            const tbody = document.getElementById('orderTable');
            tbody.innerHTML = '';
            filteredOrders.forEach((order, index) => {
                // Chuyển trạng thái và nguồn sang tiếng Việt
                let statusVN = '';
                switch (order.status) {
                    case 'cho-xac-nhan': statusVN = 'Chờ xác nhận'; break;
                    case 'dang-chuan-bi': statusVN = 'Đang chuẩn bị hàng'; break;
                    case 'dang-giao': statusVN = 'Đang giao hàng'; break;
                    case 'hoan-tat': statusVN = 'Hoàn tất'; break;
                    case 'da-huy': statusVN = 'Đã hủy'; break;
                    case 'tra-hang': statusVN = 'Trả hàng'; break;
                    default: statusVN = order.status;
                }
                let sourceVN = '';
                switch (order.source) {
                    case 'counter': sourceVN = 'Tại quầy'; break;
                    case 'online': sourceVN = 'Online'; break;
                    default: sourceVN = order.source;
                }
                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${order.id}</td>
                        <td>${order.customer}</td>
                        <td>${statusVN}</td>
                        <td>${order.createdAt}</td>
                        <td>${sourceVN}</td>
                        <td>${order.totalAmount.toLocaleString()} VNĐ</td>
                        <td>
                            <button class="btn btn-sm btn-info btn-action" onclick="openOrderDetail('${order.id}')">Xem</button>
                            <button class="btn btn-sm btn-warning btn-action" onclick="updateOrderStatus('${order.id}')">Cập nhật</button>
                            ${order.status !== 'da-huy' ? '<button class="btn btn-sm btn-danger btn-action" onclick="openCancelOrder(\'' + order.id + '\')">Hủy</button>' : ''}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Filter orders
        function filterOrders() {
            const date = document.getElementById('filterDate').value;
            const status = document.getElementById('filterStatus').value;
            const source = document.getElementById('filterSource').value;

            let filteredOrders = orders;
            if (date) filteredOrders = filteredOrders.filter(o => o.createdAt.startsWith(date.split('-').reverse().join('/')));
            if (status) filteredOrders = filteredOrders.filter(o => o.status === status);
            if (source) filteredOrders = filteredOrders.filter(o => o.source === source);

            loadOrders(filteredOrders);
        }

        // Open order detail modal
        function openOrderDetail(orderId) {
            const order = orders.find(o => o.id === orderId);
            document.getElementById('detailOrderId').textContent = order.id;
            document.getElementById('detailCustomer').textContent = order.customer;
            document.getElementById('detailCreatedAt').textContent = order.createdAt;
            document.getElementById('detailSource').textContent = order.source === 'counter' ? 'Tại quầy' : 'Online';
            document.getElementById('detailStatus').textContent = order.status;
            document.getElementById('detailPaymentMethod').textContent = order.paymentMethod;
            document.getElementById('detailTotalAmount').textContent = order.totalAmount.toLocaleString() + ' VNĐ';

            // Hiển thị các option trạng thái phù hợp
            const newStatusSelect = document.getElementById('newStatus');
            if (order.source === 'counter') {
                // Nếu là đơn hàng tại quầy, chỉ hiện thị 2 trạng thái
                newStatusSelect.innerHTML = `
                    <option value="hoan-tat">Hoàn tất</option>
                    <option value="tra-hang">Trả hàng</option>
                `;
            } else {
                // Nếu là đơn online, hiển thị tất cả trạng thái
                newStatusSelect.innerHTML = `
                    <option value="cho-xac-nhan">Chờ xác nhận</option>
                    <option value="dang-chuan-bi">Đang chuẩn bị hàng</option>
                    <option value="dang-giao">Đang giao hàng</option>
                    <option value="hoan-tat">Hoàn tất</option>
                    <option value="da-huy">Đã hủy</option>
                    <option value="tra-hang">Trả hàng</option>
                `;
            }
            newStatusSelect.value = order.status;

            const itemsBody = document.getElementById('orderItems');
            itemsBody.innerHTML = order.items.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.price.toLocaleString()} VNĐ</td>
                    <td>${(item.quantity * item.price).toLocaleString()} VNĐ</td>
                </tr>
            `).join('');
            document.getElementById('orderDetailModal').modal('show');
        }

        // Update order status
        function updateOrderStatus(orderId) {
            openOrderDetail(orderId);
            // Save status will be handled in saveStatus()
        }

        // Save status
        function saveStatus() {
            const orderId = document.getElementById('detailOrderId').textContent;
            const newStatus = document.getElementById('newStatus').value;
            const order = orders.find(o => o.id === orderId);

            // Kiểm tra nếu là đơn hàng tại quầy
            if (order.source === 'counter' && !['hoan-tat', 'tra-hang'].includes(newStatus)) {
                alert('Đơn hàng tại quầy chỉ có thể có trạng thái Hoàn tất hoặc Trả hàng!');
                return;
            }

            order.status = newStatus;
            document.getElementById('detailStatus').textContent = newStatus;
            alert(`Trạng thái đơn hàng ${orderId} đã được cập nhật thành ${newStatus}!`);
            filterOrders();
            document.getElementById('orderDetailModal').modal('hide');
        }

        // Open cancel order modal
        function openCancelOrder(orderId) {
            document.getElementById('cancelOrderId').textContent = orderId;
            document.getElementById('cancelOrderModal').modal('show');
        }

        // Confirm cancel
        function confirmCancel() {
            const orderId = document.getElementById('cancelOrderId').textContent;
            const reason = document.getElementById('cancelReason').value;
            if (!reason) {
                alert('Vui lòng nhập lý do hủy!');
                return;
            }
            const order = orders.find(o => o.id === orderId);
            order.status = 'da-huy';
            order.note = reason;
            alert(`Đơn hàng ${orderId} đã được hủy với lý do: ${reason}`);
            filterOrders();
            document.getElementById('cancelOrderModal').modal('hide');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
