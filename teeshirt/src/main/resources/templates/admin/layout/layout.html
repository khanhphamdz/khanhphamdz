    <script>
        // Revenue Chart
        const revenueChart = new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: ['18/05', '19/05', '20/05', '21/05', '22/05', '23/05', '24/05'],
                datasets: [
                    {

                        borderColor: '#1E90FF',
                        backgroundColor: 'rgba(30, 144, 255, 0.2)',
                        fill: true
                    },
                    {
                        label: 'Doanh thu online',
                        data: [3000000, 4000000, 3500000, 5000000, 4500000, 6000000, 7000000],
                        borderColor: '#FF6347',
                        backgroundColor: 'rgba(255, 99, 71, 0.2)',
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: 'Doanh thu (VNĐ)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Ngày'
                        }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    title: {
                        display: true,
                        text: 'Doanh thu theo thời gian'
                    }
                }
            }
        });

        // Order Status Chart
        const orderStatusChart = new Chart(document.getElementById('orderStatusChart'), {
            type: 'pie',
            data: {
                labels: ['Đang xử lý', 'Hoàn tất', 'Đã hủy'],
                datasets: [
                    {
                        label: 'Trạng thái đơn hàng',
                        data: [36, 72, 12],
                        backgroundColor: ['#FFCE56', '#36A2EB', '#FF6384'],
                        borderColor: ['#D4A017', '#2E8BC0', '#D53F5A'],
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    title: {
                        display: true,
                        text: 'Phân bố trạng thái đơn hàng'
                    }
                }
            }
        });

        // Function to update dashboard based on time filter
        function updateDashboard() {
            const timeFilter = document.getElementById('timeFilter').value;
            // Giả lập cập nhật dữ liệu (thay bằng API thực tế)
            if (timeFilter === 'today') {
                document.getElementById('totalRevenue').textContent = '50,000,000 VNĐ';
                document.getElementById('totalOrders').textContent = '40';
                document.getElementById('productsSold').textContent = '120';
                document.getElementById('totalInventory').textContent = '2,500';
                document.getElementById('counterOrders').textContent = '30';
                document.getElementById('onlineOrders').textContent = '10';
            } else if (timeFilter === 'week') {
                document.getElementById('totalRevenue').textContent = '150,000,000 VNĐ';
                document.getElementById('totalOrders').textContent = '120';
                document.getElementById('productsSold').textContent = '350';
                document.getElementById('totalInventory').textContent = '2,500';
                document.getElementById('counterOrders').textContent = '80';
                document.getElementById('onlineOrders').textContent = '40';
            } else {
                document.getElementById('totalRevenue').textContent = '450,000,000 VNĐ';
                document.getElementById('totalOrders').textContent = '360';
                document.getElementById('productsSold').textContent = '950';
                document.getElementById('totalInventory').textContent = '2,500';
                document.getElementById('counterOrders').textContent = '240';
                document.getElementById('onlineOrders').textContent = '120';
            }

            // Cập nhật biểu đồ (giả lập, thay bằng dữ liệu thực tế)
            revenueChart.data.datasets[0].data = timeFilter === 'today' ? [2000000, 3000000, 2500000, 4000000, 5000000, 3500000, 6000000] : [5000000, 6000000, 4500000, 7000000, 8000000, 5500000, 9000000];
            revenueChart.data.datasets[1].data = timeFilter === 'today' ? [1000000, 1500000, 2000000, 2500000, 3000000, 4000000, 5000000] : [3000000, 4000000, 3500000, 5000000, 4500000, 6000000, 7000000];
            revenueChart.update();

            orderStatusChart.data.datasets[0].data = timeFilter === 'today' ? [12, 24, 4] : [36, 72, 12];
            orderStatusChart.update();
        }
    </script>
    <script>
        // Fake data for products
        const products = [
            { id: 1, name: 'Áo thun nam', variants: [{ id: 1, color: 'Đen', size: 'M', price: 150000, stock: 50, barcode: 'THN001' }, { id: 2, color: 'Trắng', size: 'L', price: 150000, stock: 30 }] },
            { id: 2, name: 'Áo polo', variants: [{ id: 3, color: 'Xanh', size: 'S', price: 200000, stock: 20, barcode: 'POL001' }] },
            { id: 3, name: 'Áo sơ mi', variants: [{ id: 4, color: 'Trắng', size: 'M', price: 250000, stock: 15, barcode: 'SMI001' }] }
        ];

        let cart = [];
        let currentMode = 'quick';

        // Initialize mode selector for managers
        function initModeSelector() {
            const userRole = 'manager'; // Replace with actual role check (e.g., from session)
            if (userRole === 'manager') {
                document.getElementById('modeSelector').style.display = 'block';
            }
        }

        // Change mode
        function changeMode() {
            currentMode = document.getElementById('saleMode').value;
            const customerInfo = document.getElementById('customerInfo');
            if (currentMode === 'quick') {
                customerInfo.style.display = 'none';
            } else {
                customerInfo.style.display = 'block';
            }
            if (currentMode === 'delivery') {
                // Add delivery form (not implemented here for simplicity)
                alert('Chế độ giao hàng cần thêm form địa chỉ!');
            }
            updateCart();
        }

        // Search product
        document.getElementById('productSearch').addEventListener('input', function () {
            const searchText = this.value.toLowerCase();
            const matchingProducts = products.filter(p => p.name.toLowerCase().includes(searchText) || p.variants.some(v => v.barcode === searchText));
            if (matchingProducts.length === 1 && matchingProducts[0].variants.length === 1 && this.value) {
                addToCart(matchingProducts[0].variants[0]);
                this.value = '';
            }
        });

        // Add to cart
        function addToCart(variant) {
            const existingItem = cart.find(item => item.variant.id === variant.id);
            if (existingItem) {
                if (existingItem.quantity < variant.stock) existingItem.quantity++;
            } else {
                cart.push({ variant, quantity: 1 });
            }
            updateCart();
        }

        // Update cart display
        function updateCart() {
            const tbody = document.getElementById('selectedProductsBody');
            tbody.innerHTML = '';
            let total = 0;
            cart.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.variant.name || item.variant.product.name}</td>
                        <td>${item.variant.color}, ${item.variant.size}</td>
                        <td><input type="number" class="form-control" value="${item.quantity}" min="1" max="${item.variant.stock}" onchange="updateQuantity(${item.variant.id}, this.value)"></td>
                        <td>${item.variant.price.toLocaleString()} VNĐ</td>
                        <td><button class="btn btn-sm btn-danger" onclick="removeFromCart(${item.variant.id})">Xóa</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
                total += item.variant.price * item.quantity;
            });
            document.getElementById('totalAmount').textContent = total.toLocaleString() + ' VNĐ';
            document.getElementById('finalAmount').textContent = total.toLocaleString() + ' VNĐ';
            calculateChange();
        }

        // Update quantity
        function updateQuantity(variantId, quantity) {
            const item = cart.find(item => item.variant.id === variantId);
            if (item && quantity <= item.variant.stock && quantity > 0) {
                item.quantity = parseInt(quantity);
            } else {
                alert('Số lượng không hợp lệ hoặc vượt tồn kho!');
            }
            updateCart();
        }

        // Remove from cart
        function removeFromCart(variantId) {
            cart = cart.filter(item => item.variant.id !== variantId);
            updateCart();
        }

        // Clear cart
        function clearCart() {
            cart = [];
            updateCart();
        }

        // Apply coupon
        function applyCoupon() {
            const couponCode = document.getElementById('couponCode').value;
            let discount = 0;
            if (couponCode === 'DISCOUNT10') discount = 10000; // Fake discount
            const total = parseInt(document.getElementById('totalAmount').textContent.replace(/[^0-9]/g, '')) || 0;
            const discountedAmount = total - discount;
            document.getElementById('discountAmount').textContent = discount.toLocaleString() + ' VNĐ';
            document.getElementById('finalAmount').textContent = discountedAmount.toLocaleString() + ' VNĐ';
            calculateChange();
        }

        // Calculate change
        function calculateChange() {
            const amountPaid = parseInt(document.getElementById('amountPaid').value) || 0;
            const finalAmount = parseInt(document.getElementById('finalAmount').textContent.replace(/[^0-9]/g, '')) || 0;
            const change = amountPaid - finalAmount;
            document.getElementById('changeAmount').textContent = (change > 0 ? change : 0).toLocaleString() + ' VNĐ';
        }

        // Process payment
        function processPayment() {
            if (cart.length === 0) {
                alert('Vui lòng thêm sản phẩm vào giỏ hàng!');
                return;
            }
            const customerName = document.getElementById('customerName').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const customerId = document.getElementById('customerSelect').value || null;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const finalAmount = parseInt(document.getElementById('finalAmount').textContent.replace(/[^0-9]/g, '')) || 0;
            const amountPaid = parseInt(document.getElementById('amountPaid').value) || 0;

            if (amountPaid < finalAmount) {
                alert('Số tiền khách trả không đủ!');
                return;
            }

            // Fake order creation
            const orderId = new Date().getTime();
            console.log({
                orderId,
                customerId,
                customerInfo: customerId ? null : { name: customerName, phone: customerPhone },
                totalAmount: finalAmount,
                paymentMethod,
                paymentStatus: 'completed',
                items: cart.map(item => ({ variantId: item.variant.id, quantity: item.quantity, price: item.variant.price }))
            });

            alert(`Đơn hàng #${orderId} đã được tạo thành công!`);
            cart = [];
            updateCart();
        }

        // Print invoice
        function printInvoice() {
            if (cart.length === 0) {
                alert('Không có đơn hàng để in!');
                return;
            }
            const invoiceContent = `
                <h3>In hóa đơn</h3>
                <p>Thời gian: ${new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' })}</p>
                <table>
                    <thead><tr><th>Sản phẩm</th><th>Số lượng</th><th>Giá</th></tr></thead>
                    <tbody>${cart.map(item => `
                        <tr><td>${item.variant.name || item.variant.product.name} (${item.variant.color}, ${item.variant.size})</td><td>${item.quantity}</td><td>${item.variant.price.toLocaleString()} VNĐ</td></tr>
                    `).join('')}</tbody>
                </table>
                <p>Tổng tiền: ${document.getElementById('finalAmount').textContent}</p>
            `;
            const printWindow = window.open('', '', 'height=600,width=800');
            printWindow.document.write('<html><head><title>In hóa đơn</title></head><body>' + invoiceContent + '</body></html>');
            printWindow.document.close();
            printWindow.print();
        }

        // Initialize
        initModeSelector();
        updateCart();
    </script>
    <!-- JavaScript for order -->
    <script>
        // Fake data for orders
        let orders = [
            { id: '#ORD001', customer: 'Nguyễn Văn A', status: 'cho-xac-nhan', createdAt: '24/05/2025 14:00', source: 'online', paymentMethod: 'cash', totalAmount: 300000, items: [{ name: 'Áo thun nam', quantity: 2, price: 150000 }] },
            { id: '#ORD002', customer: 'Trần Thị B', status: 'hoan-tat', createdAt: '24/05/2025 13:30', source: 'counter', paymentMethod: 'card', totalAmount: 200000, items: [{ name: 'Áo polo', quantity: 1, price: 200000 }] },
            { id: '#ORD003', customer: 'Lê Văn C', status: 'da-huy', createdAt: '23/05/2025 16:00', source: 'online', paymentMethod: 'mobile', totalAmount: 250000, items: [{ name: 'Áo sơ mi', quantity: 1, price: 250000 }] },
            { id: '#ORD004', customer: 'Phạm Thị D', status: 'dang-chuan-bi', createdAt: '24/05/2025 15:00', source: 'online', paymentMethod: 'card', totalAmount: 450000, items: [{ name: 'Áo khoác', quantity: 1, price: 450000 }] },
            { id: '#ORD005', customer: 'Hoàng Văn E', status: 'dang-giao', createdAt: '24/05/2025 12:00', source: 'online', paymentMethod: 'card', totalAmount: 600000, items: [{ name: 'Áo len', quantity: 2, price: 300000 }] },
            { id: '#ORD006', customer: 'Ngô Thị F', status: 'tra-hang', createdAt: '23/05/2025 09:00', source: 'counter', paymentMethod: 'cash', totalAmount: 350000, items: [{ name: 'Áo thun nữ', quantity: 1, price: 350000 }] },
            { id: '#ORD007', customer: 'Vũ Văn G', status: 'cho-xac-nhan', createdAt: '24/05/2025 16:30', source: 'online', paymentMethod: 'card', totalAmount: 800000, items: [{ name: 'Áo vest', quantity: 1, price: 800000 }] }
        ];

        // Load orders table
        function loadOrders(filteredOrders = orders) {
            const tbody = document.getElementById('orderTable');
            tbody.innerHTML = '';
            filteredOrders.forEach((order, index) => {
                // Chuyển trạng thái và nguồn sang tiếng Việt
                let statusVN = '';
                switch (order.status) {
                    case 'cho-xac-nhan': statusVN = 'Chờ xác nhận'; break;
                    case 'dang-chuan-bi': statusVN = 'Đang chuẩn bị hàng'; break;
                    case 'dang-giao': statusVN = 'Đang giao hàng'; break;
                    case 'hoan-tat': statusVN = 'Hoàn tất'; break;
                    case 'da-huy': statusVN = 'Đã hủy'; break;
                    case 'tra-hang': statusVN = 'Trả hàng'; break;
                    default: statusVN = order.status;
                }
                let sourceVN = '';
                switch (order.source) {
                    case 'counter': sourceVN = 'Tại quầy'; break;
                    case 'online': sourceVN = 'Online'; break;
                    default: sourceVN = order.source;
                }
                const row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${order.id}</td>
                        <td>${order.customer}</td>
                        <td>${statusVN}</td>
                        <td>${order.createdAt}</td>
                        <td>${sourceVN}</td>
                        <td>${order.totalAmount.toLocaleString()} VNĐ</td>
                        <td>
                            <button class="btn btn-sm btn-info btn-action" onclick="openOrderDetail('${order.id}')">Xem</button>
                            <a href="/admin/order-detail" class="btn btn-sm btn-warning btn-action">Cập nhật</a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Filter orders
        function filterOrders() {
            const date = document.getElementById('filterDate').value;
            const status = document.getElementById('filterStatus').value;
            const source = document.getElementById('filterSource').value;

            let filteredOrders = orders;
            if (date) filteredOrders = filteredOrders.filter(o => o.createdAt.startsWith(date.split('-').reverse().join('/')));
            if (status) filteredOrders = filteredOrders.filter(o => o.status === status);
            if (source) filteredOrders = filteredOrders.filter(o => o.source === source);

            loadOrders(filteredOrders);
        }

        // Open order detail modal
        function openOrderDetail(orderId) {
            const order = orders.find(o => o.id === orderId);
            document.getElementById('detailOrderId').textContent = order.id;
            document.getElementById('detailCustomer').textContent = order.customer;
            document.getElementById('detailCreatedAt').textContent = order.createdAt;
            document.getElementById('detailSource').textContent = order.source === 'counter' ? 'Tại quầy' : 'Online';
            document.getElementById('detailStatus').textContent = order.status;
            document.getElementById('detailPaymentMethod').textContent = order.paymentMethod;
            document.getElementById('detailTotalAmount').textContent = order.totalAmount.toLocaleString() + ' VNĐ';

            // Hiển thị các option trạng thái phù hợp
            const newStatusSelect = document.getElementById('newStatus');
            if (order.source === 'counter') {
                // Nếu là đơn hàng tại quầy, chỉ hiện thị 2 trạng thái
                newStatusSelect.innerHTML = `
                    <option value="hoan-tat">Hoàn tất</option>
                    <option value="tra-hang">Trả hàng</option>
                `;
            } else {
                // Nếu là đơn online, hiển thị tất cả trạng thái
                newStatusSelect.innerHTML = `
                    <option value="cho-xac-nhan">Chờ xác nhận</option>
                    <option value="dang-chuan-bi">Đang chuẩn bị hàng</option>
                    <option value="dang-giao">Đang giao hàng</option>
                    <option value="hoan-tat">Hoàn tất</option>
                    <option value="da-huy">Đã hủy</option>
                    <option value="tra-hang">Trả hàng</option>
                `;
            }
            newStatusSelect.value = order.status;

            const itemsBody = document.getElementById('orderItems');
            itemsBody.innerHTML = order.items.map(item => `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.price.toLocaleString()} VNĐ</td>
                    <td>${(item.quantity * item.price).toLocaleString()} VNĐ</td>
                </tr>
            `).join('');
            document.getElementById('orderDetailModal').modal('show');
        }

        // Update order status
        function updateOrderStatus(orderId) {
            openOrderDetail(orderId);
            // Save status will be handled in saveStatus()
        }

        // Save status
        function saveStatus() {
            const orderId = document.getElementById('detailOrderId').textContent;
            const newStatus = document.getElementById('newStatus').value;
            const order = orders.find(o => o.id === orderId);

            // Kiểm tra nếu là đơn hàng tại quầy
            if (order.source === 'counter' && !['hoan-tat', 'tra-hang'].includes(newStatus)) {
                alert('Đơn hàng tại quầy chỉ có thể có trạng thái Hoàn tất hoặc Trả hàng!');
                return;
            }

            order.status = newStatus;
            document.getElementById('detailStatus').textContent = newStatus;
            alert(`Trạng thái đơn hàng ${orderId} đã được cập nhật thành ${newStatus}!`);
            filterOrders();
            document.getElementById('orderDetailModal').modal('hide');
        }

        // Open cancel order modal
        function openCancelOrder(orderId) {
            document.getElementById('cancelOrderId').textContent = orderId;
            document.getElementById('cancelOrderModal').modal('show');
        }

        // Confirm cancel
        function confirmCancel() {
            const orderId = document.getElementById('cancelOrderId').textContent;
            const reason = document.getElementById('cancelReason').value;
            if (!reason) {
                alert('Vui lòng nhập lý do hủy!');
                return;
            }
            const order = orders.find(o => o.id === orderId);
            order.status = 'da-huy';
            order.note = reason;

        function loadEmployees(filteredEmployees = employees) {
            const tbody = document.getElementById('employeeTable');
            tbody.innerHTML = '';
            filteredEmployees.forEach((employee, index) => {
                // Định dạng mã nhân viên: NV + 3 số
                const maNV = `NV${employee.id.toString().padStart(3, '0')}`;
                // Nếu chưa có trường giới tính thì mặc định Nam/Nữ xen kẽ
                let gender = employee.gender;
                if (!gender) gender = index % 2 === 0 ? 'Nam' : 'Nữ';
                const row = `
                    <tr>
                        <td class="text-center">${maNV}</td>
                        <td>${employee.name}</td>
                        <td>${employee.phone}</td>
                        <td>${employee.cccd || ''}</td>
                        <td>${employee.birthday ? employee.birthday.split('-').reverse().join('/') : (employee.joinDate || '')}</td>
                        <td>${gender}</td>
                        <td>${employee.status === 'active' ? 'Hoạt động' : 'Nghỉ việc'}</td>
                        <td style="min-width:120px;">
                            <button class="btn btn-sm btn-warning btn-action" onclick="openEditEmployeeModal(${employee.id})">Sửa</button>
                            <button class="btn btn-sm btn-danger btn-action${employee.status !== 'active' ? ' invisible' : ''}" onclick="openDeleteEmployeeModal(${employee.id})">Nghỉ việc</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Lọc danh sách nhân viên
        function filterEmployees() {
            const name = document.getElementById('filterName').value.toLowerCase();
            const status = document.getElementById('filterStatus').value;
            const birthdayFrom = document.getElementById('filterBirthdayFrom').value;
            const birthdayTo = document.getElementById('filterBirthdayTo').value;

            let filteredEmployees = employees;
            if (name) filteredEmployees = filteredEmployees.filter(e => e.name.toLowerCase().includes(name));
            if (status) filteredEmployees = filteredEmployees.filter(e => e.status === status);
            if (birthdayFrom) filteredEmployees = filteredEmployees.filter(e => new Date(e.birthday) >= new Date(birthdayFrom.split('/').reverse().join('-')));
            if (birthdayTo) filteredEmployees = filteredEmployees.filter(e => new Date(e.birthday) <= new Date(birthdayTo.split('/').reverse().join('-')));

            loadEmployees(filteredEmployees);
        }

        // Đặt lại bộ lọc
        function resetFilters() {
            document.getElementById('filterName').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterBirthdayFrom').value = '';
            document.getElementById('filterBirthdayTo').value = '';
            loadEmployees();
        }

        // Mở modal thêm nhân viên
        function openAddEmployeeModal() {
            document.getElementById('employeeModalLabel').textContent = 'Thêm nhân viên';
            document.getElementById('employeeForm').reset();
            document.getElementById('employeeId').value = '';
            document.getElementById('employeeJoinDate').value = '31/05/2025';
        }

        // Mở modal sửa nhân viên
        function openEditEmployeeModal(id) {
            const employee = employees.find(e => e.id === id);
            document.getElementById('editEmployeeId').value = employee.id;
            document.getElementById('editEmployeeName').value = employee.name;
            document.getElementById('editEmployeePhone').value = employee.phone;
            document.getElementById('editEmployeeEmail').value = employee.email;
            document.getElementById('editEmployeeBirthday').value = employee.birthday ? employee.birthday.split('-').reverse().join('/') : '';
            document.getElementById('editEmployeeCCCD').value = employee.cccd || '';
            document.getElementById('editEmployeeRole').value = employee.role || '';
            document.getElementById('editEmployeeJoinDate').value = employee.joinDate || '';
            if (employee.gender === 'Nam') {
                document.getElementById('editGenderMale').checked = true;
            } else {
                document.getElementById('editGenderFemale').checked = true;
            }
            var editModal = new bootstrap.Modal(document.getElementById('editEmployeeModal'));
            editModal.show();
        }

        // Lưu thông tin nhân viên
        function saveEmployee() {
            const id = document.getElementById('employeeId').value;
            const name = document.getElementById('employeeName').value;
            const phone = document.getElementById('employeePhone').value;
            const email = document.getElementById('employeeEmail').value;
            const role = document.getElementById('employeeRole').value;
            const joinDate = document.getElementById('employeeJoinDate').value;
            const birthday = document.getElementById('employeeBirthday').value;
            const gender = document.querySelector('input[name="employeeGender"]:checked')?.value;
            const cccd = document.getElementById('employeeCCCD').value;

            if (!name || !phone || !email || !role || !joinDate || !birthday || !gender || !cccd) {
                alert('Vui lòng điền đầy đủ thông tin bắt buộc!');
                return;
            }
            if (!/^[0-9]{10}$/.test(phone)) {
                alert('Số điện thoại phải là 10 chữ số!');
                return;
            }
            if (!/^[0-9]{12}$/.test(cccd)) {
                alert('CCCD phải là 12 chữ số!');
                return;
            }

            const employeeData = {
                id: id ? parseInt(id) : (employees.length ? employees[employees.length - 1].id + 1 : 1),
                name,
                phone,
                email,
                role,
                joinDate,
                birthday: birthday.split('/').reverse().join('-'),
                gender,
                cccd,
                status: 'active'
            };

            if (id) {
                const index = employees.findIndex(e => e.id === parseInt(id));
                employees[index] = employeeData;
            } else {
                employees.push(employeeData);
            }

            loadEmployees();
            var modal = bootstrap.Modal.getInstance(document.getElementById('employeeModal'));
            modal.hide();
        }

        // Mở modal xóa nhân viên
        function openDeleteEmployeeModal(id) {
            const employee = employees.find(e => e.id === id);
            document.getElementById('deleteEmployeeName').textContent = employee.name;
            var deleteModal = new bootstrap.Modal(document.getElementById('deleteEmployeeModal'));
            deleteModal.show();
        }

        // Xác nhận xóa nhân viên
        function confirmDelete() {
            const id = employees.find(e => e.name === document.getElementById('deleteEmployeeName').textContent).id;
            const employee = employees.find(e => e.id === id);
            employee.status = 'inactive';
            loadEmployees();
            var modal = bootstrap.Modal.getInstance(document.getElementById('deleteEmployeeModal'));
            modal.hide();
        }

        // Xử lý sự kiện gửi biểu mẫu
        document.getElementById('employeeForm').addEventListener('submit', function (e) {
            e.preventDefault();
            saveEmployee();
        });

        document.getElementById('editEmployeeForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const id = document.getElementById('editEmployeeId').value;
            const name = document.getElementById('editEmployeeName').value;
            const phone = document.getElementById('editEmployeePhone').value;
            const email = document.getElementById('editEmployeeEmail').value;
            const role = document.getElementById('editEmployeeRole').value;
            const joinDate = document.getElementById('editEmployeeJoinDate').value;
            const birthday = document.getElementById('editEmployeeBirthday').value;
            const gender = document.querySelector('input[name="editEmployeeGender"]:checked')?.value;
            const cccd = document.getElementById('editEmployeeCCCD').value;

            if (!name || !phone || !email || !role || !joinDate || !birthday || !gender || !cccd) {
                alert('Vui lòng điền đầy đủ thông tin bắt buộc!');
                return;
            }
            if (!/^[0-9]{10}$/.test(phone)) {
                alert('Số điện thoại phải là 10 chữ số!');
                return;
            }
            if (!/^[0-9]{12}$/.test(cccd)) {
                alert('CCCD phải là 12 chữ số!');
                return;
            }

            const employee = employees.find(e => e.id === parseInt(id));
            employee.name = name;
            employee.phone = phone;
            employee.email = email;
            employee.role = role;
            employee.joinDate = joinDate;
            employee.birthday = birthday.split('/').reverse().join('-');
            employee.gender = gender;
            employee.cccd = cccd;

            loadEmployees();
            var modal = bootstrap.Modal.getInstance(document.getElementById('editEmployeeModal'));
            modal.hide();
        });

        // Tải dữ liệu ban đầu
        loadEmployees();
    </script>

    <script>

        // Sử dụng API https://provinces.open-api.vn để lấy tỉnh/thành, quận/huyện, phường/xã
        function initializeAddressForm(provinceId, districtId, wardId) {
            const provinceSelect = document.getElementById(provinceId);
            const districtSelect = document.getElementById(districtId);
            const wardSelect = document.getElementById(wardId);

            // Load tỉnh/thành phố
            fetch('https://provinces.open-api.vn/api/p/')
                .then(res => res.json())
                .then(data => {
                    data.forEach(province => {
                        const opt = document.createElement('option');
                        opt.value = province.code;
                        opt.textContent = province.name;
                        provinceSelect.appendChild(opt);
                    });
                });

            // Khi chọn tỉnh/thành, load quận/huyện
            provinceSelect.addEventListener('change', function () {
                const provinceCode = this.value;
                districtSelect.innerHTML = '<option value="">Chọn quận/huyện</option>';
                wardSelect.innerHTML = '<option value="">Chọn phường/xã</option>';
                if (!provinceCode) return;
                fetch(`https://provinces.open-api.vn/api/p/${provinceCode}?depth=2`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.districts && Array.isArray(data.districts)) {
                            data.districts.forEach(district => {
                                const opt = document.createElement('option');
                                opt.value = district.code;
                                opt.textContent = district.name;
                                districtSelect.appendChild(opt);
                            });
                        }
                    });
            });

            // Khi chọn quận/huyện, load phường/xã
            districtSelect.addEventListener('change', function () {
                const districtCode = this.value;
                wardSelect.innerHTML = '<option value="">Chọn phường/xã</option>';
                if (!districtCode) return;
                fetch(`https://provinces.open-api.vn/api/d/${districtCode}?depth=2`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.wards && Array.isArray(data.wards)) {
                            data.wards.forEach(ward => {
                                const opt = document.createElement('option');
                                opt.value = ward.code;
                                opt.textContent = ward.name;
                                wardSelect.appendChild(opt);
                            });
                        }
                    });
            });
        }

        // Khởi tạo cho từng form
        document.addEventListener('DOMContentLoaded', function () {
            initializeAddressForm('edit-province', 'edit-district', 'edit-ward');
            initializeAddressForm('new-address-province', 'new-address-district', 'new-address-ward');

            const dateFilter = document.getElementById('dateFilter').value;

            filteredData = feedbackData.filter(feedback => {
                // Lọc theo số sao
                if (ratingFilter !== 'all') {
                    const feedbackRating = feedback.rating.split(' ')[0];
                    if (feedbackRating !== ratingFilter) return false;
                }

                // Lọc theo trạng thái
                if (statusFilter !== 'all' && feedback.status !== statusFilter) {
                    return false;
                }

                // Lọc theo ngày
                if (dateFilter) {
                    const feedbackDate = feedback.date.split('/').reverse().join('-');
                    if (feedbackDate !== dateFilter) return false;
                }

                return true;
            });

            } else {
                order.items[index] = product;
                history.push({ timestamp: currentTime, user: currentUser, action: `Sửa sản phẩm "${order.items[index].name}"` });
            }

            loadOrderDetails();
            document.getElementById('productModal').modal('hide');
        }

        // Confirm Item
        function confirmItem(index) {
            order.items[index].status = 'Thanh cong';
            history.push({ timestamp: currentTime, user: currentUser, action: `Xác nhận sản phẩm "${order.items[index].name}"` });
            loadOrderDetails();
        }

        // Delete Item
        function deleteItem(index) {
            const deletedProduct = order.items[index];
            order.items.splice(index, 1);
            history.push({ timestamp: currentTime, user: currentUser, action: `Xóa sản phẩm "${deletedProduct.name}"` });
            loadOrderDetails();
        }

        // Open Edit Order Modal
        function openEditOrderModal() {
            document.getElementById('editCustomer').value = order.customer;
            document.getElementById('editPhone').value = order.phone;
            document.getElementById('editAddress').value = order.address;
            document.getElementById('editNote').value = order.note || '';
        }

        // Save Order Info
        function saveOrderInfo() {
            order.customer = document.getElementById('editCustomer').value;
            order.phone = document.getElementById('editPhone').value;
            order.address = document.getElementById('editAddress').value;
            order.note = document.getElementById('editNote').value;
            history.push({ timestamp: currentTime, user: currentUser, action: 'Cập nhật thông tin đơn hàng' });
            loadOrderDetails();
            document.getElementById('editOrderModal').modal('hide');
        }

        // Confirm Order
        function confirmOrder() {
            const statuses = ['cho-xac-nhan', 'dang-chuan-bi', 'dang-giao', 'hoan-tat'];
            const currentIndex = statuses.indexOf(order.status);
            if (currentIndex < statuses.length - 1) {
                order.status = statuses[currentIndex + 1];
                history.push({ timestamp: currentTime, user: currentUser, action: `Xác nhận đơn hàng: ${order.status}` });
                loadOrderDetails();
            }
        }

        // Cancel Order
        function cancelOrder() {
            order.status = 'da-huy';
            history.push({ timestamp: currentTime, user: currentUser, action: 'Hủy đơn hàng' });
            loadOrderDetails();
        }

        // Load initial data
        window.onload = () => {
            loadOrderDetails();
            document.getElementById('editOrderModal').addEventListener('show.bs.modal', openEditOrderModal);
        };
    </script>
    <script>
        // Danh sách trạng thái đơn hàng (có thể lấy từ API)
        const orderStatuses = [
            { status: "Chờ xác nhận", date: "02/06/2025 14:04" },
            { status: "Đã xác nhận", date: "02/06/2025 14:10" },
            { status: "Đang giao hàng", date: "03/06/2025 09:00" },
            { status: "Đã giao hàng", date: "04/06/2025 15:30" },
            { status: "Hoàn tất", date: "04/06/2025 16:00" }
        ];

        let currentStatusIndex = 0;

        // Hàm render trạng thái
        function renderTimeline() {
            const timeline = document.getElementById('orderTimeline');
            timeline.innerHTML = ''; // Xóa timeline hiện tại

            // Render các trạng thái đến trạng thái hiện tại
            for (let i = 0; i <= currentStatusIndex; i++) {
                const status = orderStatuses[i];
                const timelineItem = document.createElement('div');
                timelineItem.className = `timeline-item ${i <= currentStatusIndex ? 'active' : ''}`;
                timelineItem.innerHTML = `
                        <div class="timeline-step">${i + 1}</div>
                        <div class="timeline-label">${status.status}</div>
                        <div class="timeline-date">${status.date}</div>
                    `;
                timeline.appendChild(timelineItem);

            }

            // Điều chỉnh hiển thị nút "Quay lại" và "Bước tiếp theo"
            const prevBtn = document.getElementById('prevStepBtn');
            const nextBtn = document.getElementById('nextStepBtn');
            if (currentStatusIndex <= 0) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'inline-block';
            }
            if (currentStatusIndex >= orderStatuses.length - 1) {
                nextBtn.style.display = 'none';
            } else {
                nextBtn.style.display = 'inline-block';
            }
        }

        // Hàm hiển thị trạng thái tiếp theo
        function showNextStatus() {
            if (currentStatusIndex < orderStatuses.length - 1) {
                currentStatusIndex++;
                renderTimeline();
            }
        }

        // Hàm hiển thị trạng thái trước đó
        function showPrevStatus() {
            if (currentStatusIndex > 0) {
                currentStatusIndex--;
                renderTimeline();
            }
        }

        // Khởi tạo timeline với trạng thái đầu tiên
        renderTimeline(0);
    </script>

            const imgList = row.querySelector('.variant-img-list');

        const employeeTableBody = document.getElementById('employeeTable');

        // Hàm hiển thị danh sách nhân viên
        function renderEmployees(employeeList) {
            employeeTableBody.innerHTML = '';
            if (employeeList.length === 0) {
                employeeTableBody.innerHTML = '<tr><td colspan="9" class="text-center">Không tìm thấy nhân viên</td></tr>';
                return;
            }
            employeeList.forEach(employee => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="text-center">${employee.id}</td>
                    <td>${employee.name}</td>
                    <td>${employee.phone}</td>
                    <td>${employee.cccd}</td>

                    selectedStatus === 'active' ? employee.status === 'Hoạt động' :

                    true
                );

            if (searchText) {
                filteredEmployees = filteredEmployees.filter(employee =>
                    employee.name.toLowerCase().includes(searchText) ||
                    employee.phone.includes(searchText) ||
                    employee.email.toLowerCase().includes(searchText)
                );
            }

                filteredEmployees = filteredEmployees.filter(employee => {

                const id = row.cells[0].textContent;
                const name = row.cells[1].textContent;
                const phone = row.cells[2].textContent;
                const cccd = row.cells[3].textContent;
                const birthday = row.cells[4].textContent;
                const gender = row.cells[5].textContent;
                const role = row.cells[6].textContent;
                const status = row.cells[7].textContent;

                // Populate edit mode
                document.getElementById('editEmployeeId').value = id;
                document.getElementById('editEmployeeName').value = name;
                document.getElementById('editEmployeePhone').value = phone;
                document.getElementById('editEmployeeCCCD').value = cccd;
                document.getElementById('editEmployeeBirthday').value = birthday.split('/').reverse().join('-');
                document.getElementById('editEmployeeEmail').value = `${name.toLowerCase().replace(/\s/g, '')}@example.com`;
                document.getElementById('editEmployeeRole').value = role;
                document.querySelector(`input[name="editEmployeeGender"][value="${gender}"]`).checked = true;
                document.querySelector(`input[name="editEmployeeStatus"][value="${status === 'Hoạt động' ? 'active' : 'inactive'}"]`).checked = true;
            });
        });

        // Khởi tạo bảng khi tải trang
        renderEmployees(employees);
    </script>
 
</body>

</html>
