<!DOCTYPE html>
<html lang="en" th:fragment="view(title, content, styles, scripts)">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:replace="${title}">Tee Shirt Vibe - Dashboard</title>
    <link rel="stylesheet" href="/admin_css/style_layout.css" />
    
    <!-- Boxiocns CDN Link -->
    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Page specific styles -->
    <th:block th:replace="${styles} ?: ~{}"></th:block>
</head>

<body>
    <div class="sidebar">
        <div class="logo-details w-100">
            <span class="logo_name w-100 text-center">Tee Shirt Vibe</span>
        </div>
        <ul class="nav-links">
            <li>
                <a href="/admin">
                    <i class="fa-solid fa-house"></i>
                    <span class="link_name">Dashboard</span>
                </a>
            </li>
            <li>
                <div class="iocn-link">
                    <a href="/admin/order/counter-sale">
                        <i class="fa-solid fa-money-bill"></i>
                        <span class="link_name">Bán hàng tại quầy</span>
                    </a>
                </div>
            </li>
            <li>
                <div class="iocn-link">
                    <a href="/admin/product">
                        <i class="fa-solid fa-shirt"></i>
                        <span class="link_name">Sản phẩm</span>
                    </a>
                    <i class="bx bxs-chevron-down arrow"></i>
                </div>
                <ul class="sub-menu">
                    <li><a href="/admin/product">Sản phẩm</a></li>
                    <li><a href="/admin/product/category">Danh mục</a></li>
                    <li><a href="/admin/product/attribute/material">Chất liệu</a></li>
                    <li><a href="/admin/product/attribute/size">Kích cỡ</a></li>
                    <li><a href="/admin/product/attribute/color">Màu sắc</a></li>
                </ul>
            </li>

            <li>
                <a href="/admin/order">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="link_name">Đơn hàng</span>
                </a>
            </li>
            <li>
                <a href="/admin/employees">
                    <i class="fa-solid fa-user"></i>
                    <span class="link_name">Nhân viên</span>
                </a>
            </li>
            <li>
                <div class="iocn-link">
                    <a href="/admin/customer">
                        <i class="fa-solid fa-user-tie"></i>
                        <span class="link_name">Khách hàng</span>
                    </a>
                </div>
            </li>
            <li>
                <a href="/admin/comment-manegement">
                <a href="/admin/comment-manegement">
                    <i class="fa-solid fa-comments"></i>
                    <span class="link_name">Đánh giá</span>
                </a>
            </li>
            <li>
                <a href="/admin/refund-management">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span class="link_name">Trả hàng</span>
                </a>
            </li>
            <li>
                <div class="iocn-link">
                    <a href="/admin/promotion">
                        <i class="fa-solid fa-ticket"></i>
                        <span class="link_name">Giảm giá</span>
                    </a>
                </div>
            </li>
            <li>
                <div class="profile-details">
                    <div class="profile-content">
                        <img src="https://res.cloudinary.com/dzfxd7vnz/image/upload/v1748244107/Screenshot_2025-01-17_100744_ktodkf.png"
                            alt="profileImg" />
                    </div>
                    <div class="name-job d-flex flex-column gap-1">
                        <span class="profile_name" th:text="${userName}">User Name</span>
                        <span class="job" th:text="${userRole}">Role</span>
                    </div>
                    <a href="/admin/logout"><i class="bx bx-log-out"></i></a>
                </div>
            </li>
        </ul>
    </div>
    <section class="home-section p-0 m-0">
        <div class="home-content d-flex flex-column">
            <div class="home-content-header border-bottom pt-2 pb-2 w-100">
                <i class="bx bx-menu"></i>
            </div>
            <!-- Main Content -->
            <main th:replace="${content}"></main>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script>
        let arrow = document.querySelectorAll(".arrow");
        for (var i = 0; i < arrow.length; i++) {
            arrow[i].addEventListener("click", (e) => {
                let arrowParent = e.target.parentElement.parentElement; //selecting main parent of arrow
                arrowParent.classList.toggle("showMenu");
            });
        }
        let sidebar = document.querySelector(".sidebar");
        let sidebarBtn = document.querySelector(".bx-menu");
        console.log(sidebarBtn);
        sidebarBtn.addEventListener("click", () => {
            sidebar.classList.toggle("close");
        });
    </script>
    <!-- Page specific scripts -->
    <th:block th:replace="${scripts} ?: ~{}"></th:block>
</body>

</html>
