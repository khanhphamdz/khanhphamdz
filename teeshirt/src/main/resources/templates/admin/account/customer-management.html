<!DOCTYPE html>
<html lang="vi"
    th:replace="~{/admin/layout/layout::view(title=~{::title}, content=~{::main}, styles=~{::styles}, scripts=~{::scripts})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khách hàng</title>
    <th:block th:fragment="styles">
        
    </th:block>
</head>

<body>
    <main class="customer-management-page w-100 p-4">
        <div class="page-header mb-4">
            <div class="header-title d-flex align-items-center justify-content-start">
                <!-- <i class="fa-solid fa-rotate-left fs-3 me-2"></i> -->
                <div>
                    <h3 class="p-0 m-0">Quản lý khách hàng</h3>
                </div>
            </div>
        </div>
        <!-- Bộ lọc -->
        <div class="card m-0 mb-4">
            <div class="card-body">
                <form class="row g-3 align-items-end" id="filterForm">
                    <div class="col-md-4">
                        <label for="filterName" class="form-label fw-semibold">Tên:</label>
                        <input type="text" class="form-control" id="filterName" placeholder="Tìm theo tên">
                    </div>
                    <div class="col-md-4">
                        <label for="filterPhone" class="form-label fw-semibold">Số điện thoại:</label>
                        <input type="tel" class="form-control" id="filterPhone" placeholder="Tìm theo số điện thoại">
                    </div>
                    <div class="col-md-4">
                        <label for="filterProvince" class="form-label fw-semibold">Khu vực:</label>
                        <select class="form-select" id="filterProvince">
                            <option value="">Tất cả</option>
                        </select>
                    </div>
                    <div class="col-12 text-end">
                        <button type="button" class="btn btn-primary px-4 fw-bold" onclick="searchCustomers()">Tìm kiếm</button>
                        <button type="button" class="btn btn-danger px-4 fw-bold ms-2" onclick="resetFilter()">Làm mới</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bảng danh sách khách hàng -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-users me-2"></i>Danh sách khách hàng</h5>
            </div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table class="table table-hover text-center align-middle" id="customerTable">
                        <thead class="bg-primary bg-gradient text-white">
                            <tr>
                                <th>#</th>
                                <th>Mã khách hàng</th>
                                <th>Họ và tên</th>
                                <th>Số điện thoại</th>
                                <th>Email</th>
                                <th>Địa chỉ</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody">
                            <!-- Dữ liệu sẽ được load bằng JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Modal Xem chi tiết khách hàng -->
        <div class="modal fade" id="viewCustomerModal" tabindex="-1" aria-labelledby="viewCustomerModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title fw-bold" id="viewCustomerModalLabel">Thông tin khách hàng</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-3">
                            <!-- Phần bên trái - Thông tin cá nhân -->
                            <div class="col-md-6">
                                <div class="card mb-3">
                                    <div class="card-header bg-light">
                                        <h6 class="mb-0 fw-bold">Thông tin cá nhân</h6>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Mã khách hàng:</label>
                                            <input type="text" class="form-control" id="viewCustomerCode" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Họ và tên:</label>
                                            <input type="text" class="form-control" id="viewCustomerName" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Số điện thoại:</label>
                                            <input type="text" class="form-control" id="viewCustomerPhone" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Email:</label>
                                            <input type="email" class="form-control" id="viewCustomerEmail" readonly>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Phần bên phải - Thông tin địa chỉ -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header bg-light">
                                        <h6 class="mb-0 fw-bold">Thông tin địa chỉ</h6>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Họ và tên người nhận:</label>
                                            <input type="text" class="form-control" id="viewAddressName" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Số điện thoại người nhận:</label>
                                            <input type="text" class="form-control" id="viewAddressPhone" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Tỉnh/Thành phố:</label>
                                            <input type="text" class="form-control" id="viewAddressProvince" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Quận/Huyện:</label>
                                            <input type="text" class="form-control" id="viewAddressDistrict" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Phường/Xã:</label>
                                            <input type="text" class="form-control" id="viewAddressWard" readonly>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label fw-semibold">Địa chỉ cụ thể:</label>
                                            <input type="text" class="form-control" id="viewAddressDetail" readonly>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    </div>
                </div>
            </div>
        </div>


    </main>

    <th:block th:fragment="scripts">
        <script src="/admin_js/customer-management.js"></script>
    </th:block>
</body>

</html>
