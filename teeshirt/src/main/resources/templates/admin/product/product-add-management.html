/* Style riêng cho trang product-add-management */
.product-add-img-list {
  display: flex;
  gap: 4px;
  align-items: center;
}
.product-add-variant-img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 12px;
  display: inline-block;
}
.product-add-upload-img-box {
  width: 90px;
  height: 90px;
  border: 2.5px dashed #ff9800;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: none;
  margin-left: 8px;
}
.product-add-upload-img-box:hover {
  border-color: #ff5722;
  box-shadow: 0 4px 16px 0 rgba(255,152,0,0.15);
}
.product-add-upload-img-box .upload-plus {
  font-size: 2rem;
  color: #ff9800;
  line-height: 1;
  margin-bottom: 2px;
  display: block;
  text-align: center;
  width: 100%;
}
.upload-img-box {
  width: 70px;
  height: 70px;
  border: 2.5px dashed #ff9800;
  border-radius: 12px;
  background: #fff8f0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center; /* căn giữa ngang */
  justify-content: center;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px 0 rgba(255,152,0,0.07);
  margin-left: 0;
  margin-right: auto;
}
.upload-img-box:hover {
  border-color: #ff5722;
  box-shadow: 0 4px 16px 0 rgba(255,152,0,0.15);
}
.upload-img-box .upload-plus,
.upload-img-box .upload-label {
  text-align: center; /* căn giữa chữ và dấu cộng */
  width: 100%;
}
.upload-img-box .upload-plus {
  font-size: 2rem;
  color: #ff9800;
  line-height: 1;
  margin-bottom: 2px;
  display: block;
}
.upload-img-box .upload-label {
  font-size: 0.95rem;
  color: #ff9800;
  font-weight: 500;
  letter-spacing: 0.5px;
  display: block;
}
.table thead th {
    background-color: #ffe0b2 !important;
    color: #333;
    font-weight: 600;
    border-bottom: 2.5px solid #ff9800;
}
.table thead th:first-child {
    border-top-left-radius: 12px;
}
.table thead th:last-child {
    border-top-right-radius: 12px;
}
.btn-action-delete {
  padding: 0.55rem 1rem;
  font-size: 1rem;
  border-radius: 10px;
  background: #ff5252;
  color: #fff;
  border: none;
  box-shadow: 0 2px 8px 0 rgba(255,82,82,0.08);
  transition: background 0.18s, box-shadow 0.18s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.btn-action-delete:hover, .btn-action-delete:focus {
  background: #ff1744;
  color: #fff;
  box-shadow: 0 2px 8px 0 rgba(255,23,68,0.13);

.btn-color.color-active {

  box-shadow: 0 0 0 3px #90caf9;
  outline: none;
  position: relative;
  z-index: 2;
}

.color-checkbox-label {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.color-checkbox {
  display: none;
}

.color-checkbox-box {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 2px solid transparent;
  margin-right: 8px;
  position: relative;
}

.color-checkbox:checked + .color-checkbox-box {

}

.size-checkbox-label {

  align-items: center;

.size-checkbox {

.size-checkbox-box {

.product-add-td-action {

.product-add-input-qty {

    <!-- Thêm đoạn script để chọn nút trong modal size và màu sắc -->
<script>
// Chọn nhiều nút cho size và màu sắc
function handleMultiSelectButton(groupSelector, btnClass, activeClass) {
  document.querySelectorAll(groupSelector).forEach(function(group) {
    group.addEventListener('click', function(e) {
      if (e.target.classList.contains(btnClass)) {
        e.target.classList.toggle(activeClass);
      }
    });
  });
}

// Bổ sung: chọn nhiều màu sắc (div), đổi border khi chọn
function handleMultiSelectDiv(groupSelector, btnClass, activeClass) {
  document.querySelectorAll(groupSelector).forEach(function(group) {
    group.addEventListener('click', function(e) {
      let target = e.target;
      if (target.classList.contains(btnClass)) {
        target.classList.toggle(activeClass);
      }
    });
  });
}

document.addEventListener('DOMContentLoaded', function() {
  // Modal size: chọn nhiều size
  handleMultiSelectButton('.modal-body-size', 'btn-size', 'active');
  // Modal màu sắc: chọn nhiều màu
  handleMultiSelectButton('.modal-body-color', 'btn-color', 'color-active');
  handleMultiSelectDiv('.modal-body-color', 'btn-color-selectable', 'color-active');
});
</script>

<!-- Đã di chuyển toàn bộ style sang file product-add-management.css -->
<script>
// Hiển thị màu đã chọn ra ngoài
function updateSelectedColors() {
  const checked = document.querySelectorAll('#modalColorSelect .color-checkbox:checked');
  const container = document.getElementById('selectedColors');
  container.innerHTML = '';
  checked.forEach(cb => {
    const span = document.createElement('span');
    span.className = 'color-checkbox-box';
    span.style.backgroundColor = cb.value;
    span.style.minWidth = '36px';
    span.style.height = '24px';
    span.style.display = 'inline-block';
    span.style.marginRight = '4px';
    container.appendChild(span);
  });
}
document.getElementById('btnColorSelectDone').addEventListener('click', updateSelectedColors);
// Hiển thị size đã chọn ra ngoài
function updateSelectedSizes() {
  const checked = document.querySelectorAll('#modalSizeSelect .size-checkbox:checked');
  const container = document.getElementById('selectedSizes');
  container.innerHTML = '';
  checked.forEach(cb => {
    const span = document.createElement('span');
    span.className = 'size-checkbox-box';
    span.textContent = cb.value;
    span.style.minWidth = '36px';
    span.style.height = '24px';
    span.style.display = 'inline-flex';
    span.style.alignItems = 'center';
    span.style.justifyContent = 'center';
    span.style.marginRight = '4px';
    container.appendChild(span);
  });
}
document.getElementById('btnSizeSelectDone').addEventListener('click', updateSelectedSizes);
</script>
<script>
// Checkbox chọn tất cả
const selectAll = document.getElementById('selectAllRows');
const rowCheckboxes = document.querySelectorAll('.row-checkbox');
if (selectAll) {
  selectAll.addEventListener('change', function() {
    rowCheckboxes.forEach(cb => cb.checked = selectAll.checked);
  });
}
</script>
<script>
// Xử lý upload nhiều ảnh, mỗi lần chọn sẽ thêm ảnh mới vào danh sách, không thay thế ảnh cũ
function handleVariantImageUpload(row) {
  const input = row.querySelector('.variant-upload-input');
  const imgList = row.querySelector('.variant-img-list');
  input.addEventListener('change', function(e) {
    Array.from(input.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = document.createElement('img');
        img.src = ev.target.result;
        img.className = 'variant-img';
        img.style.width = '70px';
        img.style.height = '70px';
        img.style.objectFit = 'cover';
        img.style.borderRadius = '12px';
        img.style.marginRight = '2px';
        imgList.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
    // reset input để lần sau chọn lại vẫn nhận file mới
    input.value = '';
  });
}
document.querySelectorAll('tr').forEach(row => {
  if (row.querySelector('.variant-upload-input')) {
    handleVariantImageUpload(row);
  }
});
</script>
