<!DOCTYPE html>
<html lang="en"
    th:replace="~{/admin/layout/layout::view(title=~{::title}, content=~{::main}, styles=~{::styles}, scripts=~{::scripts})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <th:block th:fragment="styles">
        <!-- Page specific styles will be here if any -->
        <style>
            #product-list th,
            #product-list td {
                vertical-align: middle;
            }

            .category-tree {
                padding: 10px;
            }

            .category-item {
                margin-left: 20px;
            }

            .form-check {
                margin-bottom: 5px;
            }

            .form-check-label {
                cursor: pointer;
            }

            .variant-table th,
            .variant-table td {
                font-size: 14px;
                padding: 8px;
                vertical-align: middle;
            }

            .image-preview img {
                width: 70px;

                object-fit: cover;
                margin-right: 5px;
                border-radius: 5px;
            }

            .border-dashed {
                border-style: dashed !important;
            }

            .upload-box {
                transition: all 0.3s ease;
            }

            .upload-box:hover {
                border-color: #0d6efd !important;
                cursor: pointer;
            }

            .variant-checkbox {
                cursor: pointer;
            }
        </style>
    </th:block>
</head>

<body>
    <main class="product-manage-page w-100 p-4">
        <div class="page-header d-flex justify-content-between align-items-center">
            <h3 class="page-title mb-0">Thêm sản phẩm</h3>
        </div>
        <form th:action="@{/admin/product/add-product}" method="post" enctype="multipart/form-data" id="add-product-form">
            <div class="mb-3">
                <label for="product-name" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="product-name" name="name" required
                    placeholder="Nhập tên sản phẩm" minlength="3" maxlength="100">
                <div class="form-text">Tên sản phẩm phải có từ 3-100 ký tự</div>
            </div>
            <div class="mb-3">
                <label for="product-description" class="form-label">Mô tả</label>
                <textarea class="form-control" id="product-description" name="description" rows="4"
                    placeholder="Nhập mô tả chi tiết sản phẩm"></textarea>
            </div>
            <div class="mb-3">
                <label for="product-short-description" class="form-label">Mô tả ngắn</label>
                <textarea class="form-control" id="product-short-description" name="shortDescription"
                    rows="2" placeholder="Nhập mô tả ngắn gọn" maxlength="500"></textarea>
                <div class="form-text">Tối đa 500 ký tự</div>
            </div>
            <div class="mb-3">
                <label for="product-base-price" class="form-label">Giá gốc <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="product-base-price" name="basePrice" min="0" step="1000" required>
                <div class="form-text">Giá phải lớn hơn 0</div>
            </div>
            <div class="mb-3">
                <label for="product-status" class="form-label">Trạng thái</label>
                <select class="form-select" id="product-status" name="status" required>
                    <option value="true">Hoạt động</option>
                    <option value="false">Không hoạt động</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="product-material" class="form-label">Chất liệu</label>
                <select class="form-select" id="product-material" name="materialId" required>
                    <option value="">-- Chọn chất liệu --</option>
                    <option th:each="material : ${materials}" th:value="${material.materialId}"
                        th:text="${material.name}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Danh mục sản phẩm</label>
                <div class="category-tree" style="max-height: 300px; overflow-y: auto;">
                    <div th:each="category : ${categories}" class="category-item mb-2">
                        <div class="form-check">
                            <input class="form-check-input category-checkbox" type="checkbox"
                                th:value="${category.categoryId}" th:id="'category-' + ${category.categoryId}"
                                name="selectedCategories">
                            <label class="form-check-label" th:for="'category-' + ${category.categoryId}"
                                th:text="${category.name}">
                            </label>
                        </div>
                        <!-- Danh mục con (nếu có) -->
                        <div th:if="${category.children != null and !category.children.isEmpty()}"
                            th:id="'children-' + ${category.categoryId}" class="children-categories ms-4"
                            style="display: none;">
                            <div th:each="childCategory : ${category.children}" class="category-item mb-2">
                                <div class="form-check">
                                    <input class="form-check-input category-checkbox" type="checkbox"
                                        th:value="${childCategory.categoryId}"
                                        th:id="'category-' + ${childCategory.categoryId}" name="selectedCategories">
                                    <label class="form-check-label" th:for="'category-' + ${childCategory.categoryId}"
                                        th:text="${childCategory.name}">
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Ảnh thumbnail sản phẩm</label>
                <input type="file" class="form-control" id="product-thumbnail" name="thumbnail" accept="image/*"
                    required>
                <div id="thumbnail-preview" class="mt-2"></div>
            </div>
            <button type="submit" class="btn btn-success">Lưu sản phẩm</button>
        </form>
    </main>
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>
        <script
            src="https://cdn.tiny.cloud/1/et9y6eu5ib5fny3s9tq79yff3wkv7jvtmjb30kmw42aouimt/tinymce/7/tinymce.min.js"></script>
        <script src="/admin_js/product-add.js"></script>
    </th:block>
</body>

</html>
