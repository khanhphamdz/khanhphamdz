<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        .category-card {
            border-radius: 16px;
            box-shadow: 0 2px 12px 0 rgba(255,152,0,0.10);
            background: #fff;
        }
        .category-form-label {
            font-weight: 600;
            color: #ff9800;
        }
        .btn-add-category {
            background: linear-gradient(90deg, #147dee 50%, #901de8 100%);
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.55rem 1.5rem;
            box-shadow: 0 2px 8px 0 rgba(255,152,0,0.13);
            border: none;
            transition: background 0.18s, box-shadow 0.18s;
        }
        .btn-add-category:hover {
            background: linear-gradient(90deg, #d40674 60%, #ae0230 100%);
            color: antiquewhite;
        }
        .table thead th {
            background-color: #ffe0b2 !important;
            color: #333;
            font-weight: 600;
            border-bottom: 2.5px solid #ff9800;
        }
        .table thead th:first-child {
            border-top-left-radius: 12px;
        }
        .table thead th:last-child {
            border-top-right-radius: 12px;
        }
        .card-header {
            background: #fff !important;
            border-bottom: none !important; /* Xoá gạch vàng dưới header */
        }
        .modal-content {
            background: #fff;
            border-radius: 16px;
            border: 1.5px solid #ffd180;
        }
        .modal-header {
            background: #ffe0b2;
            border-bottom: 1.5px solid #ffd180;
        }
        .modal-footer {
            background: #fff;
            border-top: 1.5px solid #ffd180;
        }
    </style>
</head>
<body>
    <main class="d-flex flex-column p-3 w-100">
        <h3 class="fw-bold text-center mb-3">Quản lý danh mục</h3>
        <!-- Khung trên: Thêm danh mục trực tiếp -->
        <div class="card category-card mb-4">
            <div class="card-body py-3">
                <form class="row g-2 align-items-end justify-content-start px-2 mb-2">
                    <div class="col-md-4 col-12">
                        <input type="text" class="form-control" placeholder="Nhập tên danh mục">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-add-category"><i class="fa-solid fa-plus me-1"></i>Thêm danh mục</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Khung dưới: Bảng danh mục -->
        <div class="card category-card flex-grow-1 d-flex flex-column">
            <div class="card-header border-0 pb-0 d-flex align-items-center justify-content-between pt-2" style="margin-top: 8px;">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-table-list me-2"></i>Danh sách danh mục</h5>
            </div>
            <div class="card-body flex-grow-1 d-flex flex-column p-3 pb-0">
                <div class="flex-grow-1 overflow-auto">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead>
                            <tr>
                                <th class="text-center" style="width: 60px;">#</th>
                                <th class="text-center">Tên danh mục</th>
                                <th class="text-center">Số sản phẩm</th>
                                <th class="text-center">Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Áo thun</td>
                                <td>25</td>
                                <td><span class="badge bg-success">Đang bán</span></td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td>Áo polo</td>
                                <td>18</td>
                                <td><span class="badge bg-success">Đang bán</span></td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td>Áo khoác</td>
                                <td>12</td>
                                <td><span class="badge bg-secondary">Ngừng bán</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
