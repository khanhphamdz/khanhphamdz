<!DOCTYPE html>
<html lang="en"
      th:replace="~{/admin/layout/layout::view(title=~{::title}, content=~{::main}, styles=~{::styles}, scripts=~{::scripts})}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý danh mục</title>
    <th:block th:fragment="styles">
        <link rel="stylesheet" href="/admin_css/category-management.css" />
    </th:block>
</head>
<body>
<main class="container py-4" th:fragment="main">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Quản lý danh mục sản phẩm</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">Thêm danh mục</button>
    </div>

    <!-- Search Form -->
    <form th:action="@{/admin/product/category}" method="get" class="mb-3">
        <div class="row">
            <div class="col-md-4">
                <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Tìm kiếm theo tên...">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-outline-primary">Tìm kiếm</button>
            </div>
        </div>
    </form>

    <!-- Category Table -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Tên danh mục</th>
                    <th>Danh mục cha</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat, iter : ${categories?.content}" th:if="${categories != null}">
                    <td th:text="${iter.index + 1 + (categories.number * categories.size)}"></td>
                    <td th:text="${cat.name}"></td>
                    <td th:text="${cat.parentName}"></td>
                    <td>
                        <button class="btn btn-sm btn-warning me-1" 
                                th:attr="data-id=${cat.categoryId},data-name=${cat.name},data-parent=${cat.parentId}" 
                                onclick="showEditCategoryModal(this)">Sửa</button>
                        <button class="btn btn-sm btn-danger" 
                                th:attr="data-id=${cat.categoryId}" 
                                onclick="deleteCategory(this)">Xóa</button>
                    </td>
                </tr>
                <tr th:if="${categories == null || categories.content.empty}">
                    <td colspan="4" class="text-center">Không có dữ liệu</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${categories != null && categories.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${categories.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/product/category(search=${search}, page=${categories.number - 1})}">Trước</a>
            </li>
            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, categories.totalPages - 1)}"
                th:classappend="${pageNum == categories.number} ? 'active'">
                <a class="page-link" th:href="@{/admin/product/category(search=${search}, page=${pageNum})}" th:text="${pageNum + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${categories.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/product/category(search=${search}, page=${categories.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>

    <!-- Modal Thêm Danh Mục -->
    <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="addCategoryForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="addCategoryModalLabel">Thêm danh mục</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="name" id="addCategoryName" maxlength="100" required />
                            <div class="invalid-feedback" id="addCategoryNameError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Danh mục cha</label>
                            <select class="form-select" name="parentId" id="addCategoryParent">
                                <option value="">-- Không có --</option>
                                <option th:each="p : ${categories?.content}" th:value="${p.categoryId}" th:text="${p.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Thêm</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Sửa Danh Mục -->
    <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-labelledby="editCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editCategoryForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editCategoryModalLabel">Sửa danh mục</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="categoryId" id="editCategoryId" />
                        <div class="mb-3">
                            <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="name" id="editCategoryName" maxlength="100" required />
                            <div class="invalid-feedback" id="editCategoryNameError"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Danh mục cha</label>
                            <select class="form-select" name="parentId" id="editCategoryParent">
                                <option value="">-- Không có --</option>
                                <option th:each="p : ${categories?.content}" th:value="${p.categoryId}" th:text="${p.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts">
    <script src="/admin_js/category-management.js"></script>
</th:block>
</body>
</html>
