<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
    th:replace="~{/customer/layout/layout::view(title=~{::title}, content=~{::main}, styles=~{::styles}, scripts=~{::scripts})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thuộc tính sản phẩm</title>
    <th:block th:fragment="styles">
                <style>
            .btn-add-color {
                background: linear-gradient(90deg, #147dee 50%, #901de8 100%);
                color: #fff;
                font-weight: 600;
                border-radius: 10px;
                padding: 0.55rem 1.5rem;
                box-shadow: 0 2px 8px 0 rgba(255, 152, 0, 0.13);
                border: none;
                transition: background 0.18s, box-shadow 0.18s;
            }

            .table-attribute th,
            .table-attribute td {
                vertical-align: middle;
                text-align: left;
                padding-left: 18px;
            }

            .table-attribute th.action-col,
            .table-attribute td.action-col {
                text-align: center;
                padding-left: 0;
            }

            .table-attribute a {
                color: #1976d2;
                text-decoration: none;
                font-size: 15px;
                font-weight: 500;
                text-transform: none;
                letter-spacing: 0.2px;
            }

            .table-attribute a:hover {
                color: #5e12d8;
            }

            .card-body {
                padding: 1rem 1.25rem;
            }
        </style>
    </th:block>
</head>

<body>
    <main class="d-flex flex-column p-3 w-100">
        <h3 class="fw-bold text-start mb-3">Các thuộc tính</h3>
        <!-- Card trên: Form thêm thuộc tính mới -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="fw-bold mb-3">Thêm thuộc tính mới</h5>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Tên</label>
                                <input type="text" class="form-control" placeholder="Tên thuộc tính"
                                    style="width: 90%;">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3 h-100 d-flex flex-column">
                                <label class="form-label">Mô tả</label>
                                <textarea class="form-control " style="height: 123px;"
                                    placeholder="Nhập mô tả cho thuộc tính này"></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-add-color">Thêm thuộc tính</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <!-- Card dưới: Bảng danh sách thuộc tính -->
        <div class="card flex-grow-1 d-flex flex-column">
            <div class="card-header border-0 pb-0 bg-white d-flex align-items-center justify-content-between pt-2"
                style="margin-top: 8px;">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-table-list me-2"></i>Danh sách thuộc tính</h5>
            </div>
            <div class="card-body flex-grow-1 d-flex flex-column p-3 pb-0">
                <div class="flex-grow-1 overflow-auto">
                    <table class="table table-hover table-attribute align-middle mb-0">
                        <thead class="bg-primary bg-gradient text-white">
                            <tr>
                                <th>Tên</th>
                                <th>Giá trị thuộc tính</th>
                                <th>Mô tả</th>
                                <th class="action-col">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Kích cỡ</td>
                                <td>L, S, XL, XXL</td>
                                <td>kích cỡ sản phẩm</td>
                                <td class="action-col">
                                    <button class="btn btn-sm btn-warning me-1" title="Sửa" data-bs-toggle="modal"
                                        data-bs-target="#edit-attribute-modal"><i
                                            class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="btn btn-sm btn-danger" title="Xoá"><i
                                            class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>Màu sắc</td>
                                <td>Đen, Trắng, Xanh</td>
                                <td>Màu sắc của sản phẩm</td>
                                <td class="action-col">
                                    <button class="btn btn-sm btn-warning me-1" title="Sửa" data-bs-toggle="modal"
                                        data-bs-target="#edit-attribute-modal"><i
                                            class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="btn btn-sm btn-danger" title="Xoá"><i
                                            class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            <tr>
                                <td>Chất liệu</td>
                                <td>cotton, cotton cao cấp</td>
                                <td>Chất liệu</td>
                                <td class="action-col">
                                    <button class="btn btn-sm btn-warning me-1" title="Sửa" data-bs-toggle="modal"
                                        data-bs-target="#edit-attribute-modal"><i
                                            class="fa-solid fa-pen-to-square"></i></button>
                                    <button class="btn btn-sm btn-danger" title="Xoá"><i
                                            class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Modal chỉnh sửa thuộc tính -->
        <div class="modal fade" id="edit-attribute-modal" tabindex="-1" aria-labelledby="editAttributeModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editAttributeModalLabel">Sửa thuộc tính</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form>
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-bold">Tên</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="edit-attribute-name"
                                        placeholder="Tên thuộc tính">
                                </div>
                            </div>
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-bold">Giá trị thuộc tính</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="edit-attribute-type"
                                        placeholder="Giá trị thuộc tính (vd: L, S, XL)">
                                </div>
                            </div>
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-bold">Mô tả</label>
                                <div class="col-sm-8">
                                    <textarea class="form-control" id="edit-attribute-description" rows="3"
                                        placeholder="Nhập mô tả cho thuộc tính này"></textarea>
                                </div>
                            </div>
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-bold">Ngày tạo</label>
                                <div class="col-sm-8">
                                    <input type="text" class="form-control" id="edit-attribute-created-date"
                                        value="07/06/2025" disabled>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary">Cập nhật</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <th:block th:fragment="scripts">

  </th:block>
</body>

</html>
