<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý màu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<style>
    .btn-add-color {
        background: linear-gradient(90deg, #147dee 50%, #901de8 100%);
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 0.55rem 1.5rem;
        box-shadow: 0 2px 8px 0 rgba(255,152,0,0.13);
        border: none;
        transition: background 0.18s, box-shadow 0.18s;
    }
    .btn-add-color:hover {
        background: linear-gradient(90deg, #d40674 60%, #ae0230 100%);
        color: antiquewhite;
    }
</style>
<body>
    <main class="d-flex flex-column p-3 w-100">
        <h3 class="fw-bold text-center mb-3">Quản lý màu</h3>
        <!-- Card bộ lọc/thêm màu -->
        <div class="card mb-4">
            <div class="card-body">
                <form class="row g-2 align-items-end justify-content-start">
                    <div class="col-auto">
                        <input type="text" class="form-control rounded-pill px-3" placeholder="Tên màu">
                    </div>
                    <div class="col-auto">
                        <input type="text" class="form-control rounded-pill px-3" placeholder="Mã màu">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-add-color fw-bold px-4"><i class="fa-solid fa-plus me-2"></i>Thêm màu</button>
                    </div>
                </form>
            </div>
        </div>
        <!-- Thông tin bảng màu -->
        <div class="card flex-grow-1 d-flex flex-column">
            <div class="card-header border-0 pb-0 bg-white d-flex align-items-center justify-content-between pt-2" style="margin-top: 8px;">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-table-list me-2"></i>Danh sách màu</h5>
            </div>
            <div class="card-body flex-grow-1 d-flex flex-column p-3 pb-0">
                <div class="flex-grow-1 overflow-auto">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="bg-primary bg-gradient text-white">
                            <tr>
                                <th class="text-center" style="width:40px;">#</th>
                                <th class="text-center">Tên màu</th>
                                <th class="text-center">Mã màu</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="text-center">1</td>
                                <td><span class="fw-bold">Tím Lavender</span></td>
                                <td><span class="badge border" style="background:#b39ddb;color:#222;min-width:60px;">#b39ddb</span></td>
                                <td><button class="btn btn-sm btn-warning me-1" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button></td>
                            </tr>
                            <tr>
                                <td class="text-center">2</td>
                                <td><span class="fw-bold">Xanh Ngọc</span></td>
                                <td><span class="badge border" style="background:#00bcd4;color:#222;min-width:60px;">#00bcd4</span></td>
                                <td><button class="btn btn-sm btn-warning me-1" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button></td>
                            </tr>
                            <tr>
                                <td class="text-center">3</td>
                                <td><span class="fw-bold">Vàng Cam</span></td>
                                <td><span class="badge border" style="background:#ffb300;color:#222;min-width:60px;">#ffb300</span></td>
                                <td><button class="btn btn-sm btn-warning me-1" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button></td>
                            </tr>
                            <tr>
                                <td class="text-center">4</td>
                                <td><span class="fw-bold">Đen</span></td>
                                <td><span class="badge border" style="background:#222;color:#fff;min-width:60px;">#222</span></td>
                                <td><button class="btn btn-sm btn-warning me-1" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Pagination -->
                <nav class="mt-4 mb-2">
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item disabled"><a class="page-link" href="#">Trước</a></li>
                        <li class="page-item active"><a class="page-link" href="#">1</a></li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">Sau</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
