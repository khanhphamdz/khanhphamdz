<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{/admin/layout/layout::view(~{::title}, ~{::main})}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tee Shirt Vibe - Quản lý sản phẩm</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <main class="product-manage-page p-4">
        <div class="page-header">
            <h3 class="page-title mb-4">Quản lý sản phẩm</h3>
            <span class="me-3">Tất cả (1)</span>
            <a href="/add-product"  class="btn btn-success">Thêm sản phẩm</a>
        </div>
        <div class="page-content mt-4">
            <div class="row">
                <div class="filter col-8 d-flex align-items-center gap-3">
                    <select name="select-category" id="select-category" class="form-select">
                        <option value="">Chọn danh mục</option>
                        <option value="ao-thun">Áo thun (10)</option>
                        <option value="ao-thun-co-tron">--Áo thun cổ tròn (5)</option>
                        <option value="ao-thun-dai-tay">--Áo thun dài tay (5)</option>
                        <option value="ao-so-mi">Áo sơ mi (1)</option>
                        <option value="ao-ba-lo">Áo ba lỗ (4)</option>
                        <option value="ao-hoodie">Áo hoodie (5)</option>
                    </select>
                    <select name="select-product-type" id="select-product-type" class="form-select">
                        <option value="">Lọc theo loại sản phẩm</option>
                        <option value="basic-product">Sản phẩm đơn giản</option>
                        <option value="product-have-variants">Sản phẩm có biến thể</option>
                    </select>
                    <select name="select-stuck-status" id="select-stuck-status" class="form-select">
                        <option value="">Lọc theo trạng thái kho</option>
                        <option value="in-stock">Còn hàng</option>
                        <option value="out-of-stock">Hết hàng</option>
                        <option value="low-stock">Hàng sắp hết</option>
                    </select>
                    <select name="select-sort" id="select-sort" class="form-select">
                        <option value="">Sắp xếp</option>
                        <option value="name-asc">Tên A-Z</option>
                        <option value="name-desc">Tên Z-A</option>
                        <option value="price-asc">Giá tăng dần</option>
                        <option value="price-desc">Giá giảm dần</option>
                        <option value="date-asc">Ngày tạo cũ nhất</option>
                        <option value="date-desc">Ngày tạo mới nhất</option>
                    </select>
                    <button type="button" class="btn btn-outline-primary text-dark" id="btn-filter">Lọc</button>
                </div>
                <div class="search col-2 ms-auto d-flex align-items-center gap-3">
                    <input type="text" class="form-control" placeholder="Tìm kiếm sản phẩm..." id="search-product">
                    <button type="button" class="btn btn-primary" id="btn-search"><i
                            class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Ảnh</th>
                        <th scope="col">Tên sản phẩm</th>
                        <th scope="col">Giá</th>
                        <th scope="col">Danh mục</th>
                        <th scope="col">Trạng thái kho</th>
                        <th scope="col">Ngày tạo</th>
                        <th scope="col">Hành động</th>
                    </tr>
                </thead>
                <tbody id="product-list">
                    <!-- Dữ liệu sản phẩm sẽ được thêm vào đây bằng JavaScript -->
                </tbody>
            </table>
        </div>
        <script>
            // Dữ liệu mẫu sản phẩm
            const products = [
                {
                    id: 1,
                    name: 'Áo thun cổ tròn',
                    imageUrl: 'https://res.cloudinary.com/dzfxd7vnz/image/upload/v1747823834/product-01_jblxvh.jpg',
                    price: 150000,
                    category: 'Áo thun',
                    stockStatus: 'Còn hàng',
                    createdAt: '2023-10-01'
                },
                {
                    id: 2,
                    name: 'Áo sơ mi nam',
                    imageUrl: 'https://res.cloudinary.com/dzfxd7vnz/image/upload/v1747823834/product-01_jblxvh.jpg',
                    price: 250000,
                    category: 'Áo sơ mi',
                    stockStatus: 'Còn hàng',
                    createdAt: '2023-10-02'
                },
                {
                    id: 3,
                    name: 'Áo ba lỗ thể thao',
                    imageUrl: 'https://res.cloudinary.com/dzfxd7vnz/image/upload/v1747823834/product-01_jblxvh.jpg',
                    price: 120000,
                    category: 'Áo ba lỗ',
                    stockStatus: 'Hết hàng',
                    createdAt: '2023-10-03'
                },
                {
                    id: 4,
                    name: 'Áo hoodie mùa đông',
                    imageUrl: 'https://res.cloudinary.com/dzfxd7vnz/image/upload/v1747823834/product-01_jblxvh.jpg',
                    price: 350000,
                    category: 'Áo hoodie',
                    stockStatus: 'Còn hàng',
                    createdAt: '2023-10-04'
                }
            ];
            function displayProducts() {
                const productList = document.getElementById('product-list');
                productList.innerHTML = ''; // Xóa nội dung cũ
    
                products.forEach((product, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <th>${index + 1}</th>
                        <th><img src="${product.imageUrl}" alt="${product.name}" style="max-width: 70px;"></th>
                        <td>${product.name}</td>
                        <td>${product.price.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' })}</td>
                        <td>${product.category}</td>
                        <td>${product.stockStatus}</td>
                        <td>${new Date(product.createdAt).toLocaleDateString()}</td>
                        <td>
                            <a href="/product-detail" class="btn btn-sm btn-primary" title="Xem chi tiết"><i class="fas fa-eye"></i></a>
                        </td>
                    `;
                    productList.appendChild(row);
                });
            }
            displayProducts();
            document.getElementById('btn-search').addEventListener('click', () => {
                const searchQuery = document.getElementById('search-product').value.toLowerCase();
                const filteredProducts = products.filter(product => product.name.toLowerCase().includes(searchQuery));
                const productList = document.getElementById('product-list');
                productList.innerHTML = ''; // Xóa nội dung cũ
    
                filteredProducts.forEach((product, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <th>${index + 1}</th>
                        <th><img src="${product.imageUrl}" alt="${product.name}" style="max-width: 70px;"></th>
                        <td>${product.name}</td>
                        <td>${product.price.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' })}</td>
                        <td>${product.category}</td>
                        <td>${product.stockStatus}</td>
                        <td>${new Date(product.createdAt).toLocaleDateString()}</td>
                        <td>
                            <a href="/product-detail" class="btn btn-sm btn-primary" title="Xem chi tiết"><i class="fas fa-eye"></i></a>
                        </td>
                    `;
                    productList.appendChild(row);
                });
            });
        </script>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>

</html>
