<!DOCTYPE html>
<html lang="vi" th:replace="admin/layout/layout :: view(~{::title}, ~{::main})">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bán hàng tại quầy - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</head>
<body>
    <main class="container-fluid p-3">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold">Bán hàng tại quầy</h3>
        </div>

        <!-- Tabs hóa đơn -->
        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="fw-bold">Hóa đơn</div>
                <button class="btn btn-sm btn-success" onclick="addOrder()" title="Tạo hóa đơn mới">
                    <i class="bi bi-plus"></i> Thêm
                </button>
            </div>
            <ul id="orderTabs" class="nav nav-tabs mb-3"></ul>
        </div>

        <div class="row">
            <!-- Bên trái: Danh sách sản phẩm -->
            <div class="col-md-7">
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control" id="searchProduct" placeholder="Tìm kiếm sản phẩm" onkeyup="filterProducts()">
                            </div>
                            <div class="col-md-6">
                                <select class="form-select" id="filterCategory" onchange="filterProducts()">
                                    <option value="">Tất cả danh mục</option>
                                    <option value="Áo thun">Áo thun</option>
                                    <option value="Áo polo">Áo polo</option>
                                    <option value="Áo khoác">Áo khoác</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-3" id="productList">
                    <!-- Sản phẩm sẽ được render động -->
                </div>
            </div>

            <!-- Bên phải: Giỏ hàng và thanh toán -->
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        <h5 class="fw-bold mb-0"><i class="bi bi-cart me-2"></i>Giỏ hàng</h5>
                    </div>
                    <div class="card-body">
                        <!-- Giỏ hàng -->
                        <div class="table-responsive">
                            <table class="table table-hover cart-table" id="cartTable">
                                <thead>
                                    <tr>
                                        <th>Tên sản phẩm</th>
                                        <th>Số lượng</th>
                                        <th>Đơn giá</th>
                                        <th>Thành tiền</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="cartItems"></tbody>
                            </table>
                        </div>

                        <!-- Tổng tiền -->
                        <div class="text-end mb-3">
                            <h5>Tổng tiền: <span id="cartTotal">0đ</span></h5>
                        </div>

                        <!-- Thông tin khách hàng -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Khách hàng:</label>
                            <div class="d-flex gap-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="customerType" id="retailCustomer" value="retail" checked onchange="toggleCustomerSelection()">
                                    <label class="form-check-label" for="retailCustomer">Khách lẻ</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="customerType" id="selectCustomer" value="select" onchange="toggleCustomerSelection()">
                                    <label class="form-check-label" for="selectCustomer">Chọn khách hàng</label>
                                </div>
                            </div>
                            <select class="form-select mt-2" id="customerList" style="display: none;">
                                <option value="">Chọn khách hàng</option>
                                <!-- Danh sách khách hàng sẽ được render động -->
                            </select>
                        </div>

                        <!-- Loại đơn hàng -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Loại đơn hàng:</label>
                            <div class="d-flex gap-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="orderType" id="storeOrder" value="store" checked onchange="toggleOrderType()">
                                    <label class="form-check-label" for="storeOrder">Tại cửa hàng</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="orderType" id="deliveryOrder" value="delivery" onchange="toggleOrderType()">
                                    <label class="form-check-label" for="deliveryOrder">Giao hàng</label>
                                </div>
                            </div>
                        </div>

                        <!-- Form giao hàng -->
                        <div class="delivery-form mb-3" id="deliveryForm">
                            <div class="mb-2">
                                <label class="form-label fw-semibold">Họ và tên:</label>
                                <input type="text" class="form-control" id="deliveryName" placeholder="Nhập họ và tên">
                            </div>
                            <div class="mb-2">
                                <label class="form-label fw-semibold">Số điện thoại:</label>
                                <input type="tel" class="form-control" id="deliveryPhone" placeholder="Nhập số điện thoại">
                            </div>
                            <div class="mb-2">
                                <label class="form-label fw-semibold">Địa chỉ giao hàng:</label>
                                <textarea class="form-control" id="deliveryAddress" rows="2" placeholder="Nhập địa chỉ giao hàng"></textarea>
                            </div>
                        </div>

                        <!-- Mã giảm giá -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mã giảm giá:</label>
                            <select class="form-select" id="discountCode" onchange="applyDiscount()">
                                <option value="">Không áp dụng</option>
                                <option value="SALE10">SALE10 - Giảm 10%</option>
                                <option value="SALE20">SALE20 - Giảm 20%</option>
                            </select>
                        </div>

                        <!-- Thanh toán -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phương thức thanh toán:</label>
                            <select class="form-select" id="paymentMethod" onchange="togglePaymentMethod()">
                                <option value="cash">Tiền mặt</option>
                                <option value="card">Thẻ tín dụng</option>
                                <option value="momo">Momo</option>
                            </select>
                        </div>

                        <!-- Tiền mặt -->
                        <div class="mb-3" id="cashPayment">
                            <label class="form-label fw-semibold">Khách trả:</label>
                            <input type="number" class="form-control" id="customerPayment" placeholder="Nhập số tiền khách trả" oninput="calculateChange()">
                            <div class="mt-2">
                                <strong>Tiền thối: <span id="changeAmount">0đ</span></strong>
                            </div>
                        </div>

                        <!-- Nút thanh toán -->
                        <div class="d-flex gap-2">
                            <button class="btn btn-danger rounded-pill" onclick="clearCart()">Hủy</button>
                            <button class="btn btn-primary rounded-pill" onclick="completeTransaction()">Thanh toán</button>
                            <button class="btn btn-success rounded-pill" onclick="printBill()">In hóa đơn</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            // Dữ liệu mẫu
            const products = [
                { id: 1, name: 'Áo thun nam', price: 150000, image: 'https://via.placeholder.com/150', stock: 10, category: 'Áo thun' },
                { id: 2, name: 'Áo polo', price: 200000, image: 'https://via.placeholder.com/150', stock: 8, category: 'Áo polo' },
                { id: 3, name: 'Áo khoác bomber', price: 350000, image: 'https://via.placeholder.com/150', stock: 5, category: 'Áo khoác' }
            ];
    
            const customers = [
                { id: '', name: 'Khách lẻ' },
                { id: 1, name: 'Nguyễn Văn A', phone: '0935123456' },
                { id: 2, name: 'Trần Thị B', phone: '0987654321' }
            ];
    
            // Biến trạng thái
            let orders = [];
            let activeOrder = null;
    
            // Khởi tạo trang
            function init() {
                addOrder();
                renderProducts();
                renderCustomerList();
            }
    
            // Thêm hóa đơn mới
            function addOrder() {
                if (orders.length >= 5) {
                    showToast('Chỉ được tạo tối đa 5 hóa đơn cùng lúc!', 'danger');
                    return;
                }
                const newOrder = {
                    id: Date.now(),
                    customer: '',
                    products: [],
                    discount: '',
                    orderType: 'store',
                    paymentMethod: 'cash',
                    paid: 0
                };
                orders.push(newOrder);
                activeOrder = newOrder.id;
                renderOrderTabs();
                renderOrderContent();
            }
    
            // Render tabs hóa đơn
            function renderOrderTabs() {
                const tabs = document.getElementById('orderTabs');
                tabs.innerHTML = '';
                orders.forEach((order, idx) => {
                    const li = document.createElement('li');
                    li.className = 'nav-item';
                    const a = document.createElement('a');
                    a.className = 'nav-link order-tab' + (order.id === activeOrder ? ' active' : '');
                    a.href = '#';
                    a.innerHTML = `Hóa đơn ${idx + 1}`;
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        setActiveOrder(order.id);
                    });
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'btn btn-sm btn-link text-danger close-btn';
                    closeBtn.innerHTML = '<i class="bi bi-x-circle"></i>';
                    closeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        removeOrder(order.id);
                    });
                    a.appendChild(closeBtn);
                    li.appendChild(a);
                    tabs.appendChild(li);
                });
            }
    
            // Render danh sách sản phẩm
            function renderProducts() {
                const productList = document.getElementById('productList');
                productList.innerHTML = products.map(p => `
                    <div class="col-4">
                        <div class="card product-card" onclick="addToCart(${p.id})">
                            <img src="${p.image}" class="card-img-top" alt="${p.name}">
                            <div class="card-body text-center">
                                <h6 class="card-title">${p.name}</h6>
                                <p class="card-text">${p.price.toLocaleString('vi-VN')}đ</p>
                                <p class="card-text text-muted">Tồn: ${p.stock}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
    
            // Render danh sách khách hàng
            function renderCustomerList() {
                const customerList = document.getElementById('customerList');
                customerList.innerHTML = customers.filter(c => c.id !== '').map(c => 
                    `<option value="${c.id}">${c.name} - ${c.phone}</option>`
                ).join('');
            }
    
            // Thêm sản phẩm vào giỏ hàng
            function addToCart(productId) {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                const product = products.find(p => p.id === productId);
                if (!product) return;
    
                const existingItem = order.products.find(item => item.productId === productId);
                if (existingItem) {
                    if (existingItem.quantity < product.stock) {
                        existingItem.quantity++;
                    } else {
                        showToast('Số lượng vượt quá tồn kho!', 'danger');
                    }
                } else {
                    if (product.stock > 0) {
                        order.products.push({
                            productId: product.id,
                            name: product.name,
                            price: product.price,
                            quantity: 1,
                            stock: product.stock
                        });
                    } else {
                        showToast('Sản phẩm đã hết hàng!', 'danger');
                    }
                }
                renderOrderContent();
            }
    
            // Render nội dung hóa đơn
            function renderOrderContent() {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                // Render giỏ hàng
                const cartItems = document.getElementById('cartItems');
                cartItems.innerHTML = '';
                let total = 0;
    
                order.products.forEach(item => {
                    const subtotal = item.price * item.quantity;
                    total += subtotal;
                    cartItems.innerHTML += `
                        <tr>
                            <td>${item.name}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-secondary" onclick="updateQuantity(${item.productId}, -1)">-</button>
                                <span class="mx-2">${item.quantity}</span>
                                <button class="btn btn-sm btn-outline-secondary" onclick="updateQuantity(${item.productId}, 1)">+</button>
                            </td>
                            <td>${item.price.toLocaleString('vi-VN')}đ</td>
                            <td>${subtotal.toLocaleString('vi-VN')}đ</td>
                            <td><button class="btn btn-sm btn-danger" onclick="removeFromCart(${item.productId})"><i class="bi bi-trash"></i></button></td>
                        </tr>
                    `;
                });
    
                // Cập nhật tổng tiền
                document.getElementById('cartTotal').textContent = total.toLocaleString('vi-VN') + 'đ';
    
                // Cập nhật trạng thái các input
                document.getElementById('retailCustomer').checked = order.customer === '';
                document.getElementById('selectCustomer').checked = order.customer !== '';
                document.getElementById('customerList').value = order.customer;
                document.getElementById('customerList').style.display = order.customer !== '' ? 'block' : 'none';
                document.getElementById('storeOrder').checked = order.orderType === 'store';
                document.getElementById('deliveryOrder').checked = order.orderType === 'delivery';
                document.getElementById('deliveryForm').style.display = order.orderType === 'delivery' ? 'block' : 'none';
                document.getElementById('discountCode').value = order.discount;
                document.getElementById('paymentMethod').value = order.paymentMethod;
                document.getElementById('customerPayment').value = order.paid;
                calculateChange();
            }
    
            // Cập nhật số lượng sản phẩm
            function updateQuantity(productId, change) {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                const item = order.products.find(item => item.productId === productId);
                if (item) {
                    item.quantity += change;
                    if (item.quantity <= 0) {
                        removeFromCart(productId);
                    } else if (item.quantity > item.stock) {
                        item.quantity = item.stock;
                        showToast('Số lượng vượt quá tồn kho!', 'danger');
                    }
                    renderOrderContent();
                }
            }
    
            // Xóa sản phẩm khỏi giỏ hàng
            function removeFromCart(productId) {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
                order.products = order.products.filter(item => item.productId !== productId);
                renderOrderContent();
            }
    
            // Chọn khách hàng
            function toggleCustomerSelection() {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                if (document.getElementById('retailCustomer').checked) {
                    order.customer = '';
                } else {
                    order.customer = document.getElementById('customerList').value;
                }
                renderOrderContent();
            }
    
            // Chọn loại đơn hàng
            function toggleOrderType() {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                order.orderType = document.getElementById('storeOrder').checked ? 'store' : 'delivery';
                renderOrderContent();
            }
    
            // Áp dụng mã giảm giá
            function applyDiscount() {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                order.discount = document.getElementById('discountCode').value;
                renderOrderContent();
            }
    
            // Tính tiền thối
            function calculateChange() {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                const total = order.products.reduce((sum, item) => sum + item.price * item.quantity, 0);
                const discount = order.discount === 'SALE10' ? 0.1 : order.discount === 'SALE20' ? 0.2 : 0;
                const finalTotal = total * (1 - discount);
                const customerPayment = parseFloat(document.getElementById('customerPayment').value) || 0;
                const change = customerPayment - finalTotal;
                document.getElementById('changeAmount').textContent = change >= 0 ? change.toLocaleString('vi-VN') + 'đ' : 'Chưa đủ tiền';
            }
    
            // Hoàn tất giao dịch
            function completeTransaction() {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                if (order.products.length === 0) {
                    showToast('Giỏ hàng trống!', 'danger');
                    return;
                }
    
                const total = order.products.reduce((sum, item) => sum + item.price * item.quantity, 0);
                const discount = order.discount === 'SALE10' ? 0.1 : order.discount === 'SALE20' ? 0.2 : 0;
                const finalTotal = total * (1 - discount);
    
                if (order.paymentMethod === 'cash') {
                    const customerPayment = parseFloat(document.getElementById('customerPayment').value) || 0;
                    if (customerPayment < finalTotal) {
                        showToast('Số tiền khách trả chưa đủ!', 'danger');
                        return;
                    }
                }
    
                showToast('Thanh toán thành công!', 'success');
                removeOrder(order.id);
            }
    
            // In hóa đơn
            function printBill() {
                const order = orders.find(o => o.id === activeOrder);
                if (!order) return;
    
                if (order.products.length === 0) {
                    showToast('Giỏ hàng trống!', 'danger');
                    return;
                }
    
                // TODO: Implement print bill logic
                showToast('Đang in hóa đơn...', 'success');
            }
    
            // Hiển thị thông báo
            function showToast(message, type = 'success') {
                const toast = document.getElementById('customToast');
                toast.innerHTML = `
                    <div class="toast-content" style="padding:16px 24px 18px 20px; border-radius:10px; background:${type === 'danger' ? '#dc3545' : '#28a745'}; color:#fff; display:flex; align-items:center; gap:12px; position:relative; min-width:220px; max-width:340px;">
                        <i class="bi ${type === 'danger' ? 'bi-x-circle-fill' : 'bi-check-circle-fill'}" style="font-size:1.4rem;"></i>
                        <span style="flex:1;">${message}</span>
                        <div class="toast-progress" style="position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(255,255,255,0.25);overflow:hidden;border-radius:0 0 10px 10px;">
                            <div class="toast-bar" style="height:100%;width:100%;background:#fff;opacity:0.7;transform:scaleX(1);transform-origin:left;transition:transform 5s linear;"></div>
                        </div>
                    </div>
                `;
                toast.style.opacity = '1';
                toast.style.transform = 'translateY(0)';
                setTimeout(() => {
                    const bar = toast.querySelector('.toast-bar');
                    if (bar) bar.style.transform = 'scaleX(0)';
                }, 30);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-30px)';
                }, 5000);
            }
    
            // Lọc sản phẩm
            function filterProducts() {
                const search = document.getElementById('searchProduct').value.toLowerCase();
                const category = document.getElementById('filterCategory').value;
                const filteredProducts = products.filter(p => 
                    p.name.toLowerCase().includes(search) && 
                    (!category || p.category === category)
                );
                const productList = document.getElementById('productList');
                productList.innerHTML = filteredProducts.map(p => `
                    <div class="col-4">
                        <div class="card product-card" onclick="addToCart(${p.id})">
                            <img src="${p.image}" class="card-img-top" alt="${p.name}">
                            <div class="card-body text-center">
                                <h6 class="card-title">${p.name}</h6>
                                <p class="card-text">${p.price.toLocaleString('vi-VN')}đ</p>
                                <p class="card-text text-muted">Tồn: ${p.stock}</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
    
            // Đăng xuất
            function logout() {
                if (confirm('Bạn có chắc muốn đăng xuất?')) {
                    showToast('Đăng xuất thành công!', 'success');
                    // TODO: Implement logout logic
                }
            }
    
            // Thêm hàm setActiveOrder để đổi tab hóa đơn
            function setActiveOrder(orderId) {
                activeOrder = orderId;
                renderOrderTabs();
                renderOrderContent();
            }
            // Thêm hàm removeOrder để xóa hóa đơn
            function removeOrder(orderId) {
                const idx = orders.findIndex(o => o.id === orderId);
                if (idx !== -1) {
                    orders.splice(idx, 1);
                    if (orders.length === 0) {
                        addOrder();
                    } else {
                        activeOrder = orders[0].id;
                    }
                    renderOrderTabs();
                    renderOrderContent();
                }
            }
    
            // Khởi tạo trang
            init();
        </script>
    </main>

    <!-- Toast thông báo -->
    <div id="customToast" style="position:fixed;top:24px;right:24px;left:auto;bottom:auto;z-index:9999;"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
