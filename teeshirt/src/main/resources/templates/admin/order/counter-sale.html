<!DOCTYPE html>
<html lang="vi"
  th:replace="~{/admin/layout/layout::view(title=~{::title}, content=~{::main}, styles=~{::styles}, scripts=~{::scripts})}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bán hàng tại quầy - Admin</title>
  <th:block th:fragment="styles">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="/admin_css/style_counter-sale.css">
  </th:block>
</head>

<body>
  <main class="container-fluid p-4  ">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Bán hàng tại quầy</h2>
    </div>
    <div class="d-flex gap-2 mb-3 align-items-center justify-content-end">
      <button class="btn btn-success rounded-pill" id="createOrderBtn" onclick="createOrder()">
        <i class="fa fa-plus me-1"></i>Tạo hóa đơn
      </button>
      <span class="text-muted small" id="orderLimitMsg"></span>
    </div>
    <ul class="nav nav-tabs mb-3" id="orderTabs"></ul>
    <div class="row">
      <!-- Sản phẩm -->
      <div class="col-md-7">
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6 d-flex align-items-center gap-2">
                <input type="text" class="form-control" id="searchProduct"
                  placeholder="Tìm kiếm sản phẩm (tên, mã, mã vạch)" onkeyup="filterProducts()" />
                <button class="btn btn-outline-secondary" id="scanQRBtn" type="button" onclick="openQRScanModal()">
                  <i class="fa fa-qrcode"></i>
                </button>
              </div>
              <div class="col-md-6">
                <select class="form-select" id="filterCategory" onchange="filterProducts()">
                  <option value="">Tất cả danh mục</option>
                  <!-- Có thể render động danh mục nếu muốn -->
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- Sửa phần sản phẩm: xóa các sản phẩm mẫu cứng, chỉ để lại div rỗng -->
        <div class="row g-3" id="productList">
          <!-- Sản phẩm sẽ được render động bằng JS -->
        </div>
      </div>
      <!-- Giỏ hàng và thanh toán -->
      <div class="col-md-5">
        <div class="card">
          <div class="card-header">
            <h5 class="fw-bold mb-0">
              <i class="fa-solid fa-cart-shopping me-2"></i>Giỏ hàng
            </h5>
          </div>
          <div class="card-body">
            <!-- Thông tin hóa đơn -->
            <div class="row mb-3">
              <div class="col-6 small text-muted">
                Thời gian tạo: <span id="createdTime"></span>
              </div>
              <div class="col-6 text-end">
                <select class="form-select form-select-sm w-auto d-inline list-employee" id="createdBy"
                  style="min-width: 150px">
                  <option value="Nguyễn Văn A">Nguyễn Văn A</option>
                  <option value="Trần Thị B">Trần Thị B</option>
                  <option value="Lê Văn C">Lê Văn C</option>
                </select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover cart-table" id="cartTable">
                <thead>
                  <tr>
                    <th>Tên sản phẩm</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                    <th>Thành tiền</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="cartItems"></tbody>
              </table>
            </div>
            <div class="text-end mb-3">
              <h5>Tổng tiền: <span id="cartTotal">0đ</span></h5>
            </div>
            <!-- Thông tin khách hàng -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Khách hàng:</label>
              <div class="d-flex gap-2">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="customerType" id="retailCustomer" value="retail"
                    checked onchange="toggleCustomerSelection()" />
                  <label class="form-check-label" for="retailCustomer">Khách lẻ</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="customerType" id="selectCustomer" value="select"
                    onchange="toggleCustomerSelection()" />
                  <label class="form-check-label" for="selectCustomer">Chọn khách hàng</label>
                </div>
              </div>
              <!-- Phần tìm kiếm khách hàng tối ưu -->
              <div id="customerSearchBox" class="mt-2" style="display: none">
                <input type="text" class="form-control mb-2" id="customerSearchInput"
                  placeholder="Tìm tên, SĐT, email..." oninput="autoCompleteCustomer()" autocomplete="off" />
                <div id="customerAutoCompleteList" class="list-group" style="max-height: 180px; overflow-y: auto"></div>
                <button class="btn btn-link p-0 mt-1" onclick="showAddCustomerModal()">+ Thêm mới khách hàng</button>
              </div>
              <!-- Hiển thị thông tin khách hàng đã chọn -->
              <div id="customerInfoBox" style="display:none;" class="mt-2"></div>
            </div>
            <!-- Bán giao hàng -->
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isDelivery" onchange="toggleDeliveryForm()" />
                <label class="form-check-label" for="isDelivery">Bán giao hàng</label>
              </div>
              <div class="delivery-form mt-2" id="deliveryForm">
                <!-- Chọn địa chỉ đã lưu của khách hàng -->
                <div class="mb-2" id="addressSelectBox" style="display:none;">
                  <label class="form-label fw-semibold">Chọn địa chỉ đã lưu:</label>
                  <select class="form-select" id="customerAddressSelect" onchange="onSelectCustomerAddress()">
                    <!-- Option địa chỉ sẽ render động -->
                  </select>
                </div>
                <!-- Bổ sung form nhập địa chỉ mới -->
                <div class="mb-2" id="provinceDistrictWardBox" style="display:none;">
                  <input id="shippingName" class="form-control mb-2" placeholder="Tên người nhận" />
                  <input id="shippingPhone" class="form-control mb-2" placeholder="Số điện thoại người nhận" />
                  <div class="row g-2">
                    <div class="col-md-4 mb-2">
                      <select id="provinceSelect" class="form-select" onchange="fetchDistricts()">
                        <option value="">Chọn tỉnh/thành</option>
                      </select>
                    </div>
                    <div class="col-md-4 mb-2">
                      <select id="districtSelect" class="form-select" onchange="fetchWards()">
                        <option value="">Chọn quận/huyện</option>
                      </select>
                    </div>
                    <div class="col-md-4 mb-2">
                      <select id="wardSelect" class="form-select">
                        <option value="">Chọn phường/xã</option>
                      </select>
                    </div>
                  </div>
                  <input id="addressDetail" class="form-control mb-2" placeholder="Số nhà, tên đường..." />
                </div>
                <!-- XÓA textarea cũ nhập địa chỉ giao hàng -->
              </div>
            </div>
            <!-- Thanh toán -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Phương thức thanh toán:</label>
              <select class="form-select" id="paymentMethod">
                <option value="cash">Tiền mặt</option>
                <option value="card">Chuyển khoản</option>
              </select>
            </div>
            <div class="mb-3" id="cashPayment" style="display: block">
              <label class="form-label fw-semibold">Khách trả:</label>
              <input type="number" class="form-control" id="customerPayment" placeholder="Nhập số tiền khách trả"
                oninput="calculateChange()" />
              <div class="mt-2">
                <strong>Tiền thối: <span id="changeAmount">0đ</span></strong>
              </div>
            </div>
            <!-- Thêm vào phần thanh toán, trước nút Thanh toán -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Mã giảm giá:</label>
              <div class="input-group">
                <input type="text" class="form-control" id="couponCode" placeholder="Nhập mã giảm giá">
                <button class="btn btn-outline-primary" type="button" onclick="applyCoupon()">Áp dụng</button>
              </div>
              <div id="couponMessage" class="text-success small mt-1"></div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-danger rounded-pill" onclick="clearCart()">
                Hủy
              </button>
              <button class="btn btn-primary rounded-pill" onclick="confirmPayment()">Thanh toán</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="customToast"></div>
    <div class="modal fade" id="qrScanModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Quét mã QR</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="qr-reader" style="width: 100%"></div>
            <div id="qr-reader-results"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="invoicePreviewModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Xem trước hóa đơn</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="invoiceContent">
            <!-- Nội dung hóa đơn sẽ được thêm vào đây -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>
            <button type="button" class="btn btn-primary" onclick="printInvoiceContent()">
              <i class="fas fa-print me-1"></i>In
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="invoiceModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Hóa đơn bán hàng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="invoiceModalContent">
            <!-- Nội dung hóa đơn sẽ được thêm vào đây -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>
            <button type="button" class="btn btn-primary" onclick="exportToPDF()">
              <i class="fas fa-file-pdf me-1"></i>Xuất PDF
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal thêm mới khách hàng -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Thêm mới khách hàng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="addCustomerForm">
              <div class="mb-3">
                <label class="form-label">Họ tên *</label>
                <input type="text" class="form-control" name="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Số điện thoại *</label>
                <input type="tel" class="form-control" name="phoneNumber" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email">
              </div>
              <div class="mb-3">
                <label class="form-label">Địa chỉ</label>
                <textarea class="form-control" name="address" rows="2"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="button" class="btn btn-primary" onclick="submitAddCustomer()">Thêm</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <th:block th:fragment="scripts">
      <script src="/admin_js/counter-sale.js"></script>
  </th:block>
</body>

</html>
