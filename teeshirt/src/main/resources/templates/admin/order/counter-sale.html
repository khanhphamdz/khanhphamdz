<!DOCTYPE html>
<html lang="vi"
  th:replace="~{/admin/layout/layout::view(title=~{::title}, content=~{::main}, styles=~{::styles}, scripts=~{::scripts})}">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bán hàng tại quầy - Admin</title>
  <th:block th:fragment="styles">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="/admin_css/style_counter-sale.css">
  </th:block>
</head>

<body>
  <main class="container-fluid p-4  ">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Bán hàng tại quầy</h2>
    </div>
    <div class="d-flex gap-2 mb-3 align-items-center justify-content-end">
      <button class="btn btn-success rounded-pill" id="createOrderBtn" onclick="createOrder()">
        <i class="fa fa-plus me-1"></i>Tạo hóa đơn
      </button>
      <span class="text-muted small" id="orderLimitMsg"></span>
    </div>
    <ul class="nav nav-tabs mb-3" id="orderTabs"></ul>
    <div class="row">
      <!-- Sản phẩm -->
      <div class="col-md-7">
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6 d-flex align-items-center gap-2">
                <input type="text" class="form-control" id="searchProduct"
                  placeholder="Tìm kiếm sản phẩm (tên, mã, mã vạch)" onkeyup="filterProducts()" />
                <button class="btn btn-outline-secondary" id="scanQRBtn" type="button" onclick="openQRScanModal()">
                  <i class="fa fa-qrcode"></i>
                </button>
              </div>
              <div class="col-md-6">
                <select class="form-select" id="filterCategory" onchange="filterProducts()">
                  <option value="">Tất cả danh mục</option>
                  <!-- Có thể render động danh mục nếu muốn -->
                </select>
              </div>
            </div>
          </div>
        </div>
        <!-- Sửa phần sản phẩm: xóa các sản phẩm mẫu cứng, chỉ để lại div rỗng -->
        <div class="row g-3" id="productList">
          <!-- Sản phẩm sẽ được render động bằng JS -->
        </div>
      </div>
      <!-- Giỏ hàng và thanh toán -->
      <div class="col-md-5">
        <div class="card">
          <div class="card-header">
            <h5 class="fw-bold mb-0">
              <i class="fa-solid fa-cart-shopping me-2"></i>Giỏ hàng
            </h5>
          </div>
          <div class="card-body">
            <!-- Thông tin hóa đơn -->
            <div class="row mb-3">
              <div class="col-6 small text-muted">
                Thời gian tạo: <span id="createdTime"></span>
              </div>
              <div class="col-6 text-end">
                <select class="form-select form-select-sm w-auto d-inline list-employee" id="createdBy" style="min-width: 150px">
                  <option value="Nguyễn Văn A">Nguyễn Văn A</option>
                  <option value="Trần Thị B">Trần Thị B</option>
                  <option value="Lê Văn C">Lê Văn C</option>
                </select>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover cart-table" id="cartTable">
                <thead>
                  <tr>
                    <th>Tên sản phẩm</th>
                    <th>Số lượng</th>
                    <th>Đơn giá</th>
                    <th>Thành tiền</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="cartItems"></tbody>
              </table>
            </div>
            <div class="text-end mb-3">
              <h5>Tổng tiền: <span id="cartTotal">0đ</span></h5>
            </div>
            <!-- Thông tin khách hàng -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Khách hàng:</label>
              <div class="d-flex gap-2">
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="customerType" id="retailCustomer" value="retail"
                    checked onchange="toggleCustomerSelection()" />
                  <label class="form-check-label" for="retailCustomer">Khách lẻ</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="radio" name="customerType" id="selectCustomer" value="select"
                    onchange="toggleCustomerSelection()" />
                  <label class="form-check-label" for="selectCustomer">Chọn khách hàng</label>
                </div>
              </div>
              <!-- Phần tìm kiếm khách hàng tối ưu -->
              <div id="customerSearchBox" class="mt-2" style="display: none">
                <input type="text" class="form-control mb-2" id="customerSearchInput"
                  placeholder="Tìm tên, SĐT, email..." oninput="autoCompleteCustomer()" autocomplete="off" />
                <div id="customerAutoCompleteList" class="list-group" style="max-height: 180px; overflow-y: auto"></div>
                <button class="btn btn-link p-0 mt-1" onclick="showAddCustomerModal()">+ Thêm mới khách hàng</button>
              </div>
              <!-- Hiển thị thông tin khách hàng đã chọn -->
              <div id="customerInfoBox" style="display:none;" class="mt-2"></div>
            </div>
            <!-- Bán giao hàng -->
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isDelivery" onchange="toggleDeliveryForm()" />
                <label class="form-check-label" for="isDelivery">Bán giao hàng</label>
              </div>
              <div class="delivery-form mt-2" id="deliveryForm">
                <!-- Chọn địa chỉ đã lưu của khách hàng -->
                <div class="mb-2" id="addressSelectBox" style="display:none;">
                  <label class="form-label fw-semibold">Chọn địa chỉ đã lưu:</label>
                  <select class="form-select" id="customerAddressSelect" onchange="onSelectCustomerAddress()">
                    <!-- Option địa chỉ sẽ render động -->
                  </select>
                </div>
                <div class="mb-2">
                  <label class="form-label fw-semibold">Địa chỉ giao hàng:</label>
                  <textarea class="form-control" id="deliveryAddress" rows="2"
                    placeholder="Nhập địa chỉ giao hàng"></textarea>
                </div>
              </div>
            </div>
            <!-- Thanh toán -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Phương thức thanh toán:</label>
              <select class="form-select" id="paymentMethod">
                <option value="cash">Tiền mặt</option>
                <option value="card">Chuyển khoản</option>
              </select>
            </div>
            <div class="mb-3" id="cashPayment" style="display: block">
              <label class="form-label fw-semibold">Khách trả:</label>
              <input type="number" class="form-control" id="customerPayment" placeholder="Nhập số tiền khách trả"
                oninput="calculateChange()" />
              <div class="mt-2">
                <strong>Tiền thối: <span id="changeAmount">0đ</span></strong>
              </div>
            </div>
            <!-- Thêm vào phần thanh toán, trước nút Thanh toán -->
            <div class="mb-3">
              <label class="form-label fw-semibold">Mã giảm giá:</label>
              <div class="input-group">
                <input type="text" class="form-control" id="couponCode" placeholder="Nhập mã giảm giá">
                <button class="btn btn-outline-primary" type="button" onclick="applyCoupon()">Áp dụng</button>
              </div>
              <div id="couponMessage" class="text-success small mt-1"></div>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-danger rounded-pill" onclick="clearCart()">
                Hủy
              </button>
              <button class="btn btn-primary rounded-pill" onclick="confirmPayment()">Thanh toán</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="customToast"></div>
    <div class="modal fade" id="qrScanModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Quét mã QR</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="qr-reader" style="width: 100%"></div>
            <div id="qr-reader-results"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="invoicePreviewModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Xem trước hóa đơn</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="invoiceContent">
            <!-- Nội dung hóa đơn sẽ được thêm vào đây -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>
            <button type="button" class="btn btn-primary" onclick="printInvoiceContent()">
              <i class="fas fa-print me-1"></i>In
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="invoiceModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Hóa đơn bán hàng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="invoiceModalContent">
            <!-- Nội dung hóa đơn sẽ được thêm vào đây -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Đóng
            </button>
            <button type="button" class="btn btn-primary" onclick="exportToPDF()">
              <i class="fas fa-file-pdf me-1"></i>Xuất PDF
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal thêm mới khách hàng -->
    <div class="modal fade" id="addCustomerModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Thêm mới khách hàng</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="addCustomerForm">
              <div class="mb-3">
                <label class="form-label">Họ tên *</label>
                <input type="text" class="form-control" name="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Số điện thoại *</label>
                <input type="tel" class="form-control" name="phoneNumber" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email">
              </div>
              <div class="mb-3">
                <label class="form-label">Địa chỉ</label>
                <textarea class="form-control" name="address" rows="2"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="button" class="btn btn-primary" onclick="submitAddCustomer()">Thêm</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <th:block th:fragment="scripts">
    <script>
      // --- BIẾN TOÀN CỤC ---
      let carts = [{}]; // Mỗi hóa đơn là 1 cart
      let activeOrder = 0;
      let orderCount = 1;
      const ORDER_LIMIT = 5;
      let selectedCustomer = null;
      let customerAddresses = [];
      // Thêm biến toàn cục lưu employeeId hiện tại
      let currentEmployeeId = null;
      // Thêm biến toàn cục cho coupon
      let appliedCoupon = null;
      let discountAmount = 0;

      function createOrder() {
        if (orderCount >= ORDER_LIMIT) {
          showToast("Chỉ có thể tạo tối đa 5 hóa đơn 1 lúc", "danger");
          return;
        }
        carts.push({});
        orderCount++;
        activeOrder = carts.length - 1;
        updateOrderTabs();
        renderCart();
        updateOrderLimitMsg();
      }
      function updateOrderTabs() {
        const orderTabs = document.getElementById("orderTabs");
        orderTabs.innerHTML = "";
        for (let i = 0; i < carts.length; i++) {
          orderTabs.innerHTML += `<li class="nav-item">
            <button class="nav-link${i === activeOrder ? " active" : ""
            }" onclick="switchOrder(${i})">Hóa đơn ${i + 1
            } <span class='text-danger' style='cursor:pointer;' onclick='closeOrder(event,${i})'>&times;</span></button>
        </li>`;
        }
      }
      function switchOrder(idx) {
        activeOrder = idx;
        updateOrderTabs();
        renderCart();
        // Nếu hóa đơn này là mới (chưa từng nhập gì), reset các trường nhập liệu
        let cart = carts[activeOrder];
        if (!cart._initialized) {
          document.getElementById("customerPayment").value = "";
          document.getElementById("changeAmount").textContent = "0đ";
          document.getElementById("isDelivery").checked = false;
          document.getElementById("retailCustomer").checked = true;
          document.getElementById("customerList").value = "";
          document.getElementById("deliveryAddress").value = "";
          document.getElementById("paymentMethod").selectedIndex = 0;
          toggleCustomerSelection();
          toggleDeliveryForm();
          cart._initialized = true;
        }
      }
      function closeOrder(e, idx) {
        e.stopPropagation();
        if (carts.length === 1) return;
        carts.splice(idx, 1);
        if (activeOrder >= carts.length) activeOrder = carts.length - 1;
        orderCount--;
        updateOrderTabs();
        renderCart();
        updateOrderLimitMsg();
      }
      function updateOrderLimitMsg() {
        const msg = document.getElementById("orderLimitMsg");
        if (orderCount >= ORDER_LIMIT) {
          msg.textContent = "Đã đạt giới hạn 5 hóa đơn.";
          document.getElementById("createOrderBtn").disabled = true;
        } else {
          msg.textContent = `Đã tạo ${orderCount}/5 hóa đơn.`;
          document.getElementById("createOrderBtn").disabled = false;
        }
      }

      // Hàm kiểm tra tồn kho sản phẩm
      function checkProductStock(productId, size = null, color = null) {
        if (productVariants[productId]) {
          // Nếu là sản phẩm có biến thể
          if (!size || !color) return 0;
          const variant = productVariants[productId].find(
            (v) => v.size === size && v.color === color
          );
          return variant ? variant.stock : 0;
        } else {
          // Nếu là sản phẩm thường
          return productStock[productId] || 0;
        }
      }

      // Hàm cập nhật tồn kho sản phẩm
      function updateProductStock(
        productId,
        quantity,
        size = null,
        color = null
      ) {
        if (productVariants[productId]) {
          // Nếu là sản phẩm có biến thể
          if (!size || !color) return false;
          const variant = productVariants[productId].find(
            (v) => v.size === size && v.color === color
          );
          if (variant) {
            variant.stock -= quantity;
            return true;
          }
          return false;
        } else {
          // Nếu là sản phẩm thường
          if (productStock[productId] !== undefined) {
            productStock[productId] -= quantity;
            return true;
          }
          return false;
        }
      }

      // Cập nhật hàm addToCart
      function addToCart(item) {
        let cart = carts[activeOrder];
        if (!cart.items) cart.items = [];
        cart._initialized = true;

        // Xác định key duy nhất cho sản phẩm hoặc biến thể
        let key = item.variantId ? `${item.productId}_${item.variantId}` : `${item.productId}`;

        // Tìm sản phẩm/biến thể đã có trong giỏ
        let existingItem = cart.items.find(i => (i.variantId ? `${i.productId}_${i.variantId}` : `${i.productId}`) === key);

        // Kiểm tra tồn kho
        let maxQty = item.quantityInStock || 99;
        if (existingItem) {
          if (existingItem.quantity + 1 > maxQty) {
            showToast('Số lượng vượt quá tồn kho!', 'danger');
            return;
          }
          existingItem.quantity++;
        } else {
          cart.items.push({
            productId: item.productId,
            variantId: item.variantId,
            name: item.name,
            price: item.price,
            quantity: 1,
            imageUrl: item.imageUrl,
            quantityInStock: maxQty,
            size: item.size,
            color: item.color
          });
        }
        renderCart();
      }

      // Cập nhật hàm confirmVariant
      function confirmVariant(productId, name, price, category, image) {
        const size = document.getElementById("variantSize").value;
        const color = document.getElementById("variantColor").value;
        const currentStock = checkProductStock(productId, size, color);

        if (currentStock <= 0) {
          showToast("Biến thể này đã hết hàng!", "danger");
          return;
        }

        let cart = carts[activeOrder];
        if (!cart.items) cart.items = [];
        cart._initialized = true;

        const key = `${productId}_${size}_${color}`;
        const existingItem = cart.items.find((item) => item.id === key);

        if (existingItem) {
          if (existingItem.quantity < currentStock) {
            existingItem.quantity++;
          } else {
            showToast("Số lượng vượt quá tồn kho biến thể!", "danger");
            return;
          }
        } else {
          cart.items.push({
            id: key,
            name: name + ` (${size}, ${color})`,
            price,
            quantity: 1,
            stock: currentStock,
            category,
            image,
            size,
            color,
          });
        }
        renderCart();
        document.getElementById("variantModal").remove();
        showToast("Đã thêm vào giỏ hàng!");
      }

      // Cập nhật hàm updateVariantStock
      function updateVariantStock() {
        const size = document.getElementById("variantSize").value;
        const color = document.getElementById("variantColor").value;
        const modal = document.getElementById("variantModal");
        if (!modal) return;

        const productId = Object.keys(variants).find((vid) =>
          variants[vid].some((v) => v.size === size && v.color === color)
        );

        if (productId) {
          const currentStock = checkProductStock(productId, size, color);
          document.getElementById(
            "variantStockInfo"
          ).textContent = `Tồn kho: ${currentStock}`;
        } else {
          document.getElementById("variantStockInfo").textContent =
            "Không có tồn kho";
        }
      }

      // Sửa completeTransaction để gửi dữ liệu về backend
      async function completeTransaction() {
        if (carts[activeOrder].items.length === 0) {
          showToast("Giỏ hàng trống!", "danger");
          return;
        }

        const cart = carts[activeOrder];
        const items = cart.items.map(item => ({
          productVariantId: item.variantId,
          quantity: item.quantity,
          price: item.price
        }));

        const total = items.reduce((sum, i) => sum + i.price * i.quantity, 0);
        const finalAmount = total - discountAmount;
        const customerPayment = parseFloat(document.getElementById("customerPayment").value) || 0;
        if (customerPayment < finalAmount) {
          showToast("Số tiền khách trả chưa đủ!", "danger");
          return;
        }

        const payment = {
          paymentType: document.getElementById("paymentMethod").value === "cash" ? "COD" : "BANK",
          amount: finalAmount,
          paymentStatus: "completed"
        };

        const orderData = {
          customerId: selectedCustomer ? selectedCustomer.customerId : null,
          employeeId: currentEmployeeId,
          shippingAddress: document.getElementById("isDelivery").checked ? {
            specificAddress: document.getElementById("deliveryAddress").value
            // Có thể bổ sung các trường khác nếu có
          } : null,
          items,
          payment,
          finalAmount: finalAmount,
          discountAmount: discountAmount,
          couponId: appliedCoupon,
          shippingFee: 0,
          note: "",
          orderType: "offline"
        };

        try {
          const res = await fetch('/api/counter-sale/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderData)
          });
          const result = await res.json();
          if (res.ok && result && result.orderId) {
            showToast('Thanh toán thành công!');
            // Reset giỏ hàng, render lại, show hóa đơn...
            carts[activeOrder] = {};
            renderCart();
            // Có thể gọi showInvoice(result) nếu muốn show hóa đơn từ backend
          } else {
            showToast(result.message || 'Lỗi khi lưu hóa đơn!', 'danger');
          }
        } catch (err) {
          showToast('Lỗi khi gửi hóa đơn!', 'danger');
        }
      }

      function showInvoice() {
        const cart = carts[activeOrder];
        const now = new Date();
        const pad = (n) => n.toString().padStart(2, "0");
        const dateStr = `${pad(now.getDate())}/${pad(
          now.getMonth() + 1
        )}/${now.getFullYear()} ${pad(now.getHours())}:${pad(
          now.getMinutes()
        )}`;

        // Tính toán tổng tiền và giảm giá
        const subtotal = cart.items.reduce(
          (sum, item) => sum + item.price * item.quantity,
          0
        );
        const discount = discountAmount; // Có thể thêm logic tính giảm giá ở đây
        const total = subtotal - discount;
        const customerPayment =
          parseFloat(document.getElementById("customerPayment").value) || 0;
        const change = customerPayment - total;

        // Tạo nội dung hóa đơn
        let invoiceHTML = `
            <div class="p-4">
                <div class="invoice-header">
                    <h3>TeeShirtVibe</h3>
                </div>
                
                <div class="invoice-info">
                    <p>HÓA ĐƠN BÁN HÀNG</p>
                    <p>Mã hóa đơn: HD${Date.now().toString().slice(-6)}</p>
                    <p>Ngày: ${dateStr}</p>
                    <p>Nhân viên: ${document.getElementById("createdBy").value
          }</p>
                </div>
                
                <div class="invoice-info">
                    <h6>Thông tin khách hàng:</h6>
                    <p>
                        ${document.getElementById("selectCustomer").checked
            ? document.getElementById("customerSearchInput")
              .value
            : "Khách lẻ"
          }
                    </p>
                    ${document.getElementById("isDelivery").checked
            ? `<p>Địa chỉ giao hàng: ${document.getElementById("deliveryAddress").value
            }</p>`
            : ""
          }
                </div>
                
                <div class="table-responsive invoice-table">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Sản phẩm</th>
                                <th class="text-end">SL</th>
                                <th class="text-end">Đơn giá</th>
                                <th class="text-end">Thành tiền</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${cart.items
            .map(
              (item) => `

        cartItems.innerHTML = "";

        cart.items.forEach((item) => {

                        <img src="${item.imageUrl || "https://via.placeholder.com/40"

                    <td><button class="btn btn-sm btn-danger" onclick="removeFromCart('${item.variantId ? `${item.productId}_${item.variantId}` : `${item.productId}`}')"><i class="fas fa-trash"></i></button></td>
                </tr>
            `;
        });
        // Hiển thị tổng tiền và giảm giá
        let totalHtml = total.toLocaleString("vi-VN") + "đ";
        if (discountAmount > 0) {
          totalHtml += ` <span class='text-success'>(- ${discountAmount.toLocaleString("vi-VN")}đ)</span>`;
        }
        document.getElementById("cartTotal").innerHTML =
          (total - discountAmount).toLocaleString("vi-VN") + "đ";
        calculateChange();
      }
      function updateQuantity(key, change) {
        let cart = carts[activeOrder];
        if (!cart.items) return;
        const item = cart.items.find(i => (i.variantId ? `${i.productId}_${i.variantId}` : `${i.productId}`) === key);
        if (item) {
          const newQuantity = item.quantity + change;
          if (newQuantity <= 0) {
            removeFromCart(key);
          } else if (newQuantity > (item.quantityInStock || 99)) {
            showToast('Số lượng vượt quá tồn kho!', 'danger');
          } else {
            item.quantity = newQuantity;
            renderCart();
          }
        }
      }
      function removeFromCart(key) {
        let cart = carts[activeOrder];
        if (!cart.items) return;
        cart.items = cart.items.filter(i => (i.variantId ? `${i.productId}_${i.variantId}` : `${i.productId}`) !== key);
        renderCart();
      }
      function calculateChange() {
        let cart = carts[activeOrder];
        if (!cart.items) cart.items = [];
        const total = cart.items.reduce(
          (sum, item) => sum + item.price * item.quantity,
          0
        );
        const customerPayment =
          parseFloat(document.getElementById("customerPayment").value) || 0;
        const change = customerPayment - total;
        document.getElementById("changeAmount").textContent =
          change >= 0 ? change.toLocaleString("vi-VN") + "đ" : "Chưa đủ tiền";
      }
      function openQRScanModal() {
        const modal = new bootstrap.Modal(
          document.getElementById("qrScanModal")
        );
        modal.show();

        // Khởi tạo scanner khi modal hiển thị
        document
          .getElementById("qrScanModal")
          .addEventListener("shown.bs.modal", function () {
            if (!html5QrcodeScanner) {
              html5QrcodeScanner = new Html5Qrcode("qr-reader");
              const config = { fps: 10, qrbox: { width: 250, height: 250 } };

              html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
              );
            }
          });

        // Dừng scanner khi đóng modal
        document
          .getElementById("qrScanModal")
          .addEventListener("hidden.bs.modal", function () {
            if (html5QrcodeScanner) {
              html5QrcodeScanner.stop().then(() => {
                html5QrcodeScanner = null;
              });
            }
          });
      }
      function onScanSuccess(decodedText, decodedResult) {
        // Xử lý kết quả quét QR
        try {
          const productData = JSON.parse(decodedText);
          if (productData.id && productData.name && productData.price) {
            // Nếu là sản phẩm có biến thể
            if (productVariants[productData.id]) {
              showVariantModal(
                productData.id,
                productData.name,
                productData.price,
                productData.category,
                productData.image
              );
            } else {
              // Nếu là sản phẩm thường
              addToCart(productData);
            }
            // Đóng modal sau khi quét thành công
            bootstrap.Modal.getInstance(
              document.getElementById("qrScanModal")
            ).hide();
            showToast("Quét mã thành công!");
          } else {
            showToast("Mã QR không hợp lệ!", "danger");
          }
        } catch (error) {
          showToast("Mã QR không hợp lệ!", "danger");
        }
      }
      function onScanFailure(error) {
        // Xử lý lỗi quét QR
        console.warn(`Lỗi quét QR: ${error}`);
      }

      // --- CHỌN SẢN PHẨM, LẤY CHI TIẾT VÀ BIẾN THỂ ---
      async function onProductClick(productId) {
        const res = await fetch(`/api/counter-sale/products/${productId}`);
        const product = await res.json();
        if (product.variants && product.variants.length > 0) {
          showVariantModal(product);
        } else {
          // Nếu không có biến thể, thêm trực tiếp vào giỏ
          addToCart({
            productId: product.productId,
            name: product.name,
            price: product.basePrice,
            quantityInStock: product.quantityInStock || 99,
            imageUrl: (product.images && product.images[0] && product.images[0].imageUrl) || ''
          });
        }
      }

      function showVariantModal(product) {
        let html = `<div class='modal fade' id='variantModal' tabindex='-1'>
                      <div class='modal-dialog'>
                        <div class='modal-content'>
                          <div class='modal-header'><h5 class='modal-title'>Chọn biến thể cho ${product.name}</h5>
                            <button type='button' class='btn-close' data-bs-dismiss='modal'></button>
                          </div>
                          <div class='modal-body'>`;
                          product.variants.forEach(variant => {
                            html += `<div class='form-check'>
                                        <input class='form-check-input' type='radio' name='variantRadio' id='variant${variant.variantId}' value='${variant.variantId}'>
                                        <label class='form-check-label' for='variant${variant.variantId}'>
                                          ${variant.sizeName || ''} - ${variant.colorName || ''} - Giá: ${variant.price.toLocaleString()}đ - Tồn: ${variant.quantityInStock}
                                        </label>
                                      </div>`;
                                          });
                          html += `</div>
                          <div class='modal-footer'>
                            <button type='button' class='btn btn-primary' onclick='confirmVariantAddToCart(${JSON.stringify(product)})'>Thêm vào giỏ</button>
                          </div>
                        </div>
                      </div>
                    </div>`;
        document.body.insertAdjacentHTML('beforeend', html);
        var modal = new bootstrap.Modal(document.getElementById('variantModal'));
        modal.show();
        document.getElementById('variantModal').addEventListener('hidden.bs.modal', function () {
          document.getElementById('variantModal').remove();
        });

      function confirmVariantAddToCart(product) {
        const checked = document.querySelector('input[name="variantRadio"]:checked');
        if (!checked) {
          alert('Vui lòng chọn biến thể!');
          return;
        }
        const variantId = checked.value;
        const variant = product.variants.find(v => v.variantId == variantId);
        addToCart({
          productId: product.productId,
          variantId: variant.variantId,
          name: product.name + ' ' + (variant.sizeName || '') + ' ' + (variant.colorName || ''),
          price: variant.price,
          quantityInStock: variant.quantityInStock,
          imageUrl: (product.images && product.images[0] && product.images[0].imageUrl) || '',
          size: variant.sizeName,
          color: variant.colorName
        });
        var modal = bootstrap.Modal.getInstance(document.getElementById('variantModal'));
        modal.hide();
      }

      // --- TỐI ƯU CHỌN KHÁCH HÀNG VÀ ĐỊA CHỈ ---
      async function autoCompleteCustomer() {
        const keyword = document.getElementById('customerSearchInput').value.trim();
        const listBox = document.getElementById('customerAutoCompleteList');
        if (!keyword) {
          listBox.innerHTML = '';
          return;
        }
        // Gọi API tìm kiếm khách hàng
        const res = await fetch(`/api/counter-sale/customers/search?query=${encodeURIComponent(keyword)}`);
        const customers = await res.json();
        listBox.innerHTML = customers.length
          ? customers.map(c => `<a href='#' class='list-group-item list-group-item-action' onclick='selectCustomerUI(${JSON.stringify(c)})'>${c.name} - ${c.phoneNumber} - ${c.email || '---'}</a>`).join('')
          : "<div class='list-group-item text-muted'>Không tìm thấy khách hàng</div>";
      }

      function selectCustomerUI(cus) {
        selectedCustomer = cus;
        document.getElementById('customerSearchInput').value = `${cus.name} - ${cus.phoneNumber}`;
        document.getElementById('customerAutoCompleteList').innerHTML = '';
        // Hiển thị thông tin chi tiết
        document.getElementById('customerInfoBox').style.display = 'block';
        document.getElementById('customerInfoBox').innerHTML = `
          <div class="card p-2">
            <div><strong>${cus.name}</strong> (${cus.phoneNumber})</div>
            <div>Email: ${cus.email || '---'}</div>
            <div>Đã mua: ${cus.totalOrders || 0} đơn, Tổng chi: ${(cus.totalSpent || 0).toLocaleString()}đ</div>
            <button class="btn btn-link p-0" onclick="changeCustomer()">Chọn lại khách hàng</button>
          </div>
        `;
        // Lấy địa chỉ
        fetch(`/api/counter-sale/customers/${cus.customerId}/addresses`)
          .then(res => res.json())
          .then(addresses => {
            customerAddresses = addresses;
            renderCustomerAddresses();
          });
      }

      function changeCustomer() {
        selectedCustomer = null;
        document.getElementById('customerInfoBox').style.display = 'none';
        document.getElementById('customerSearchInput').value = '';
        document.getElementById('customerAutoCompleteList').innerHTML = '';
        document.getElementById('addressSelectBox').style.display = 'none';
        document.getElementById('deliveryAddress').value = '';
      }

      function renderCustomerAddresses() {
        const addressSelectBox = document.getElementById('addressSelectBox');
        const addressSelect = document.getElementById('customerAddressSelect');
        if (customerAddresses.length > 0) {
          addressSelectBox.style.display = 'block';
          addressSelect.innerHTML = customerAddresses.map(addr =>
            `<option value="${addr.specificAddress}">${addr.specificAddress}</option>`
          ).join('') + '<option value="">Nhập địa chỉ mới</option>';
          document.getElementById('deliveryAddress').value = customerAddresses[0].specificAddress;
        } else {
          addressSelectBox.style.display = 'none';
          document.getElementById('deliveryAddress').value = '';
        }
      }

      function onSelectCustomerAddress() {
        const val = document.getElementById('customerAddressSelect').value;
        document.getElementById('deliveryAddress').value = val;
      }

      function toggleCustomerSelection() {
        const isSelect = document.getElementById("selectCustomer").checked;
        document.getElementById("customerSearchBox").style.display = isSelect ? "block" : "none";
        document.getElementById("customerInfoBox").style.display = "none";
        document.getElementById('addressSelectBox').style.display = "none";
        document.getElementById('deliveryAddress').value = '';
        selectedCustomer = null;
      }

      // --- THÊM MỚI KHÁCH HÀNG ---
      function showAddCustomerModal() {
        const modal = new bootstrap.Modal(document.getElementById('addCustomerModal'));
        modal.show();
      }

      async function submitAddCustomer() {
        const form = document.getElementById('addCustomerForm');
        const formData = new FormData(form);
        const customerData = Object.fromEntries(formData.entries());
        
        try {
          const res = await fetch('/api/counter-sale/customers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(customerData)
          });
          const result = await res.json();
          if (result.status === 'ok') {
            showToast('Thêm khách hàng thành công!');
            bootstrap.Modal.getInstance(document.getElementById('addCustomerModal')).hide();
            form.reset();
            // Tự động chọn khách hàng vừa tạo
            selectCustomerUI(result.data);
          } else {
            showToast(result.message || 'Lỗi khi thêm khách hàng!', 'danger');
          }
        } catch (err) {
          showToast('Lỗi khi thêm khách hàng!', 'danger');
        }
      }

      function confirmPayment() {
        if (confirm('Bạn có chắc chắn muốn thanh toán hóa đơn này không?')) {
          completeTransaction();
        }
      }

      // Thêm hàm xử lý mã giảm giá
      async function applyCoupon() {
        const code = document.getElementById('couponCode').value.trim();
        if (!code) return;
        // Gọi API kiểm tra mã giảm giá
        const res = await fetch(`/api/coupons/validate?code=${encodeURIComponent(code)}`);
        const data = await res.json();
        if (data && data.valid) {
          appliedCoupon = data.couponId;
          discountAmount = data.discountAmount || 0;
          document.getElementById('couponMessage').textContent = `Áp dụng thành công: Giảm ${discountAmount.toLocaleString()}đ`;
          renderCart(); // Cập nhật lại tổng tiền
        } else {
          appliedCoupon = null;
          discountAmount = 0;
          document.getElementById('couponMessage').textContent = 'Mã giảm giá không hợp lệ!';
        }
      }
    </script>
  </th:block>

</body>

</html>
