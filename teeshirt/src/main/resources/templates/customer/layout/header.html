<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
</head>

<body>
  <header id="main-header" class="menu-toggle transparent-header py-3">
    <div class="container d-flex align-items-center justify-content-between">
      <!-- Logo -->
      <a href="/" class="logo fw-bold fs-4 text-dark text-decoration-none">
        <span style="color:#7f00ff;">TEE</span>
        <span style="color:#000000;">SHIRT</span>
        <span style="color:#666;">VIBE</span>
      </a>

      <!-- Menu desktop -->
      <ul class="main-menu d-flex mb-0 list-unstyled align-items-center">
        <li class="me-4"><a href="/" class="menu-link">Trang Chủ</a></li>
        <li class="me-4">
          <a href="/product" class="menu-link">Sản Phẩm</a>
          <ul class="sub-menu">
            <li><a href="" class="menu-link">T-Shirts</a></li>
            <li><a href="" class="menu-link">Hoodies</a></li>
            <li><a href="" class="menu-link">Accessories</a></li>
          </ul>
        </li>
        <li class="me-4"><a href="/about" class="menu-link">Giới Thiệu</a></li>
        <li class="me-4"><a href="/contact" class="menu-link">Liên Hệ</a></li>
      </ul>

      <!-- Icons -->
      <div class="icon-group d-flex align-items-center">
        <div class="position-relative me-3">
          <button class="btn-search" data-bs-toggle="modal" data-bs-target="#exampleModal">
            <i class="fas fa-search fs-5"></i>
          </button>
        </div>
        <a href="/wishlist" class="text-dark position-relative me-3">
          <i class="fas fa-heart fs-5"></i>
          <span id="wishlist-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">0</span>
        </a>
        <a href="/account" class="text-dark position-relative me-3">
          <i class="fa-solid fa-user fs-5"></i>
        </a>
        <button id="btn-show-cart-item" class="p-0 bg-transparent border-0 shadow-none text-dark position-relative" type="button"
          data-bs-toggle="offcanvas" data-bs-target="#offcanvasCart" aria-controls="offcanvasCart">
          <i class="fas fa-shopping-cart fs-5"></i>
          <span id="cart-badge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary"></span>
        </button>
      </div>
    </div>
  </header>
  <!-- ModalSearch -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Tìm kiếm sản phẩm</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
        </div>

        <!-- Body -->
        <div class="modal-body">
          <form class="row g-2 align-items-center">
            <div class="col-md-10">
              <div class="input-group">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control" id="filter" placeholder="Tìm sản phẩm mong muốn...">
              </div>
            </div>
            <div class="col-md-2">
              <button type="button" class="btn btn-success w-100" id="btn-search-product">Tìm kiếm</button>
            </div>
          </form>

          <!-- Kết quả tìm kiếm -->
          <div class="mt-4 product-search-list">
            <h6 class="text-muted">Loading...</h6>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Offcanvas giỏ hàng -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasCart" aria-labelledby="offcanvasCartLabel">
    <div class="offcanvas-header">
      <h5 id="offcanvasCartLabel">Giỏ hàng của bạn</h5>
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
    </div>
    <div class="offcanvas-body" id="cart-offcanvas-body">
      <!-- Danh sách sản phẩm sẽ render ở đây -->
    </div>
  </div>
</body>

</html>
