<!DOCTYPE html>
<html lang="en" th:fragment="view(title, content)" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">Tee Shirt Vibe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="/customer_ui_css/layout/style_header.css">
  <link rel="stylesheet" href="/customer_ui_css/layout/style_footer.css">
  <link rel="stylesheet" href="/customer_ui_css/layout/style_layout.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/customer_ui_css/style_index.css">
  
</head>

<body>
  <header th:replace="~{/customer/layout/header}"></header>
  <!-- Thêm nội dung để có thể scroll -->
  <main class="container mt-5" th:replace="${content}"></main>
  <!-- Back to top -->
  <div class="btn-back-to-top" id="myBtn">
    <span class="symbol-btn-back-to-top">
      <i class="zmdi zmdi-chevron-up"></i>
    </span>
  </div>
  <footer th:replace="~{/customer/layout/footer}"></footer>
</body>
<script>
  $(document).ready(function() {
      $('.js-remove-wish').on('click', function(e) {
          e.preventDefault();
          $(this).closest('.isotope-item').fadeOut(300, function() {
              $(this).remove();
              if ($('.isotope-grid').children().length === 0) {
                  $('#empty-wishlist').fadeIn(300);
              }
          });
      });
  });
</script>
</html>
