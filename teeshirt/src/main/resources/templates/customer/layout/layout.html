<!DOCTYPE html>
<html lang="en" th:fragment="view(title, content)" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">Tee Shirt Vibe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/customer_css/layout_css/style_header.css">
  <link rel="stylesheet" href="/customer_css/layout_css/style_footer.css">
  <link rel="stylesheet" href="/customer_css/layout_css/style_layout.css">
  <link rel="stylesheet" href="/customer_css/style_index.css">
  <link rel="stylesheet" href="/customer_css/product_css/style_product_list.css">
  <link rel="stylesheet" href="/customer_css/product_css/style_product_detail.css">
  <link rel="stylesheet" href="/customer_css/cart_css/style_cart.css">
</head>

<body>
  <header th:replace="~{/customer/layout/header}"></header>
  <main th:replace="${content}"></main>
  <button id="back-to-top"><i class="fa-solid fa-up-long"></i></button>
  <footer th:replace="~{/customer/layout/footer}"></footer>

  <!-- Scripts Layout -->
  <script src="/customer_js/layout_js/layout.js"></script>
  <!-- Scripts Product -->
  <script src="/customer_js/product_js/product_detail.js"></script>
  <!-- Scripts Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
