<!DOCTYPE html>
<html lang="vi" th:fragment="view(title, content, styles, scripts)" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:replace="${title}">Tee Shirt Vibe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/customer_css/layout_css/style_header.css">
  <link rel="stylesheet" href="/customer_css/layout_css/style_footer.css">
  <link rel="stylesheet" href="/customer_css/layout_css/style_layout.css">
  
  <!-- Page specific styles -->
  <th:block th:replace="${styles} ?: ~{}"></th:block>
</head>

<body>
  <header th:replace="~{/customer/layout/header}"></header>
  <main th:replace="${content}"></main>
  <button id="back-to-top"><i class="fa-solid fa-up-long"></i></button>
  <footer th:replace="~{/customer/layout/footer}"></footer>
  <!-- Scripts Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Scripts Layout -->
  <script src="/customer_js/layout_js/layout.js"></script>
  
  <!-- Page specific scripts -->
  <th:block th:replace="${scripts} ?: ~{}">
    <script src="/customer_js/login-register_js/login-register.js"></script>
  </th:block>
  <script src="/customer_js/account_js/cart-offcanvas.js"></script>
  
</body>

</html>
