<!DOCTYPE html>
<html lang="vi" th:replace="~{/customer/layout/layout::view(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .error-message, .success-message { display: none; margin-top: 10px; }
        .error-message { color: red; }
        .success-message { color: green; }
    </style>
</head>
<body>
<div th:fragment="main">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center  mt-2">
                    <h2 id="formTitle">Đăng Nhập</h2>
                </div>
                <ul class="nav nav-tabs" id="authTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="true">Đăng Nhập</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab" aria-controls="register" aria-selected="false">Đăng Ký</button>
                    </li>
                </ul>
                <div class="tab-content" id="authTabContent">
                    <!-- Đăng Nhập -->
                    <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
                        <form id="loginForm" class="mt-4">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="loginEmail" name="email" required placeholder="Nhập email">
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Mật Khẩu</label>
                                <input type="password" class="form-control" id="loginPassword" name="password" required placeholder="Nhập mật khẩu">
                            </div>
                            <div class="mb-3 form-check d-flex justify-content-between align-items-center">
                                <div>
                                    <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Ghi Nhớ Đăng Nhập</label>
                                </div>
                                <a href="#" class="float-end">Quên Mật Khẩu?</a>
                            </div>
                            <div id="loginError" class="error-message"></div>
                            <div id="loginSuccess" class="success-message"></div>
                            <button type="submit" class="btn btn-primary w-100">Đăng Nhập</button>
                            <div class="text-center mt-3">
                                <p>Hoặc đăng nhập bằng</p>
                                <button type="button" class="btn btn-outline-danger me-2" id="loginGoogleBtn"><i class="fab fa-google"></i> Google</button>
                                <button type="button" class="btn btn-outline-primary" id="loginFacebookBtn"><i class="fab fa-facebook-f"></i> Facebook</button>
                            </div>
                        </form>
                    </div>
                    <!-- Đăng Ký -->
                    <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
                        <form id="registerForm" class="mt-4">
                            <div class="mb-3">
                                <label for="registerName" class="form-label">Họ Tên</label>
                                <input type="text" class="form-control" id="registerName" name="name" required placeholder="Nhập họ tên">
                            </div>
                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="registerEmail" name="email" required placeholder="Nhập email">
                            </div>
                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Mật Khẩu</label>
                                <input type="password" class="form-control" id="registerPassword" name="password" required placeholder="Nhập mật khẩu">
                            </div>
                            <div class="mb-3">
                                <label for="registerConfirmPassword" class="form-label">Xác Nhận Mật Khẩu</label>
                                <input type="password" class="form-control" id="registerConfirmPassword" name="confirmPassword" required placeholder="Xác nhận mật khẩu">
                            </div>
                            <div id="registerError" class="error-message"></div>
                            <div id="registerSuccess" class="success-message"></div>
                            <button type="submit" class="btn btn-primary w-100">Đăng Ký</button>
                            <div class="text-center mt-3">
                                <p>Hoặc đăng ký bằng</p>
                                <button type="button" class="btn btn-outline-danger me-2" id="registerGoogleBtn"><i class="fab fa-google"></i> Google</button>
                                <button type="button" class="btn btn-outline-primary" id="registerFacebookBtn"><i class="fab fa-facebook-f"></i> Facebook</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
<script src="/static/customer_js/login-register_js/login-register.js"></script>

</body>
</html>
