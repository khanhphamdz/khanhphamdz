<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/customer_css/account/login-register.css">
</head>

<body>
    <main class="login-register-section container" style="padding-top: 120px;">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-register-wrap">
                    <!-- Tabs -->
                    <ul class="nav nav-tabs login-register-tabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="login-tab" data-bs-toggle="tab" href="#login" role="tab">Đăng
                                Nhập</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="register-tab" data-bs-toggle="tab" href="#register" role="tab">Đăng
                                Ký</a>
                        </li>
                    </ul>

                    <!-- Nội Dung Tab -->
                    <div class="tab-content">
                        <!-- Form Đăng Nhập -->
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form id="login-form" class="login-form">
                                <div class="wrap-input1 m-b-20">
                                    <input class="input1 stext-107 cl7" type="text" name="email_phone"
                                        placeholder="Email hoặc Số Điện Thoại" required>
                                    <div class=" trans-04"></div>
                                </div>
                                <div class="wrap-input1 m-b-20">
                                    <input class="input1 stext-107 cl7" type="password" name="password"
                                        placeholder="Mật Khẩu" required>
                                    <div class=" trans-04"></div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center ps-3 pe-3">
                                    <div class="contact100-form-checkbox">
                                        <input class="input-checkbox100" id="ckb1" type="checkbox" name="remember-me">
                                        <label class="label-checkbox100" for="ckb1">Ghi Nhớ Đăng Nhập</label>
                                    </div>
                                    <a href="forgot-password.html"
                                        class="stext-107 cl7 hov-cl1 trans-04 text-decoration-none">Quên Mật Khẩu?</a>
                                </div>
                                <button class="mt-3" type="submit">
                                    Đăng Nhập
                                </button>
                                <div class="text-center mt-2 mb-2">
                                    <span class="stext-107 cl7">Hoặc đăng nhập bằng</span>
                                </div>
                                <div class="social-login flex-c-m p-t-10">
                                    <a href="https://myaccount.google.com/" class="social-btn google-btn m-r-10"><i
                                            class="fa fa-google"></i> Google</a>
                                    <a href="#" class="social-btn facebook-btn"><i class="fa fa-facebook"></i>
                                        Facebook</a>
                                </div>
                            </form>
                        </div>
                        <!-- Form Đăng Ký -->
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form id="register-form" class="register-form">
                                <div class="wrap-input1 m-b-20">
                                    <input class="input1 stext-107 cl7" type="text" name="name" placeholder="Họ và Tên"
                                        required>
                                    <div class=" trans-04"></div>
                                </div>
                                <div class="wrap-input1 m-b-20">
                                    <input class="input1 stext-107 cl7" type="text" name="email_phone"
                                        placeholder="Email hoặc Số Điện Thoại" required>
                                    <div class=" trans-04"></div>
                                </div>
                                <div class="wrap-input1 m-b-20">
                                    <input class="input1 stext-107 cl7" type="password" name="password"
                                        placeholder="Mật Khẩu" required>
                                    <div class=" trans-04"></div>
                                </div>
                                <div class="wrap-input1 m-b-20">
                                    <input class="input1 stext-107 cl7" type="password" name="confirm_password"
                                        placeholder="Xác Nhận Mật Khẩu" required>
                                    <div class=" trans-04"></div>
                                </div>
                                <button class="flex-c-m stext-101 cl0 size-103 bg1 bor1 hov-btn2 p-lr-15 trans-04"
                                    type="submit">
                                    Đăng Ký
                                </button>
                                <div class="text-center mt-2 mb-2">
                                    <span class="stext-107 cl7">Hoặc đăng ký bằng</span>
                                </div>
                                <div class="social-login flex-c-m p-t-10">
                                    <a href="#" class="social-btn google-btn m-r-10"><i class="fa fa-google"></i>
                                        Google</a>
                                    <a href="#" class="social-btn facebook-btn"><i class="fa fa-facebook"></i>
                                        Facebook</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
