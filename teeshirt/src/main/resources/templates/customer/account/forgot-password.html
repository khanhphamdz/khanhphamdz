<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu - CozaStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/customer_css/account_css/forgot-password.css">
</head>
</head>

<body>
    <!-- Phần Quên Mật Khẩu -->
    <main class="bg0 pt5 p-b-140 forgot-password-section container" style="padding-top: 120px;">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="forgot-password-wrap">
                    <h3 class="mtext-105 cl2 text-center m-b-30">Quên Mật Khẩu</h3>
                    <p class="stext-107 cl7 text-center m-b-30">
                        Vui lòng nhập email của bạn. Chúng tôi sẽ gửi liên kết đặt lại mật khẩu.
                    </p>
                    <form id="forgot-password-form" class="forgot-password-form">
                        <div class="wrap-input1 m-b-20">
                            <input class="input1 stext-107 cl7" type="text" name="email_phone" id="email"
                                placeholder="Email hoặc Số Điện Thoại" required>
                            <div class="focus-input1 trans-04"></div>
                        </div>
                        <button id="btn-forgot-password"
                            class="flex-c-m stext-101 cl0 size-103 bg1 bor1 hov-btn2 p-lr-15 trans-04" type="button">
                            Gửi Yêu Cầu
                        </button>
                    </form>
                    <div class="text-center p-t-20">
                        <a href="/account/login" class="stext-107 cl7 hov-cl1 trans-04">Quay Lại Đăng Nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('btn-forgot-password').addEventListener('click', getForgotPassword);
        })
        function getForgotPassword() {
            const email = document.getElementById('email').value;
            fetch('http://localhost:8080/api/auth/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "ok") {
                        alert(data.message)
                    }
                    console.log(data);
                })
                .catch(error => console.error('Lỗi:', error));
        }
    </script>
</body>

</html>
